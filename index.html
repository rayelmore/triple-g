<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple-G Golf App</title>
<link rel="icon" type="image/png" href="3g-icon.png">
<link rel="apple-touch-icon" href="3g-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone-first app shell — hero, stacked cards, fixed bottom tab bar (mirrors the FPG app) */
  --bg:#f1f2ee; --surface:#ffffff; --ink:#1d2417; --muted:#6a7262; --line:#e2e5dc;
  --green:#2f5419; --green-2:#3d6b22; --gold:#e8b938; --gold-soft:#f6efd6;
  --good:#2b7a2f; --bad:#b3261e; --warn:#a86a00;
  --display:"Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Roboto","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11150e; --surface:#1b2116; --ink:#e9ede4; --muted:#a3ab9a; --line:#2c3426;
    --green:#3f6e23; --green-2:#4d7f2c; --gold:#f0c64e; --gold-soft:#2c2a19;
    --good:#6cc46f; --bad:#ef7b72; --warn:#e3a43a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11150e; --surface:#1b2116; --ink:#e9ede4; --muted:#a3ab9a; --line:#2c3426;
  --green:#3f6e23; --green-2:#4d7f2c; --gold:#f0c64e; --gold-soft:#2c2a19;
  --good:#6cc46f; --bad:#ef7b72; --warn:#e3a43a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:92px;background:var(--bg)}
a{color:var(--green-2)}
:root[data-theme="dark"] a{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--gold)}}
button,input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* hero */
.hero{position:relative;color:#fff;text-align:left;padding:12px 16px;overflow:hidden;background:#1f3a12}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .inner{position:relative;display:flex;align-items:center;justify-content:center;gap:14px}
.hero .htxt{display:grid;gap:2px;min-width:0}
.logo{width:76px;flex:none;border-radius:12px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.4);background:#1d3a24}
.logo img{display:block;width:100%;height:auto}
.hero h1{font:800 26px/1.05 var(--display);color:var(--gold);margin:0;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.45);text-wrap:balance}
.hero .tag{font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.hero .welcome{font-size:15px;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.5)}

main{padding:18px 16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card h2,.sect{font:700 22px/1.15 var(--display);margin:0 0 12px;text-wrap:balance}
.kicker{font:700 17px var(--display);letter-spacing:1px;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:14px}

/* next round */
.next{background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;border:0}
.next .kicker{color:#fff;opacity:.95}
.next .body{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.datebox{width:96px;height:96px;border:2px solid var(--gold);border-radius:14px;background:rgba(232,185,56,.18);display:grid;place-items:center;align-content:center;color:var(--gold)}
.datebox b{font:800 40px/1 var(--display)} .datebox span{font:600 16px var(--display);color:#fff;letter-spacing:1px;margin-top:4px}
.next .course{font:800 28px/1.1 var(--display)}
.next .meta{opacity:.92}
.countdown{margin-top:16px;background:rgba(0,0,0,.18);border-radius:12px;padding:12px;text-align:center;font-size:18px}
.countdown b{color:var(--gold);font:800 26px var(--display)}
.note{margin-top:10px;font-size:14px;opacity:.9}

/* avatars */
.avatars{display:flex;flex-wrap:wrap;gap:12px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);color:var(--gold);background:var(--green);border:3px solid var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.av.sm{width:42px;height:42px;font-size:16px}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:112px;height:112px;font-size:38px;border-width:4px}
.av.xs{width:28px;height:28px;font-size:11px;border-width:2px;box-shadow:none}
.wholist>div{display:flex;align-items:center;gap:8px}
.photobox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);color:#1d2417}
.btn.ghost{background:transparent;color:var(--green-2);border:1.5px solid var(--green-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* dues */
.dues{background:var(--gold-soft);border:2px solid var(--gold);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.dues .ic{width:52px;height:52px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#1d2417;font:800 26px var(--display)}
.dues h2{color:var(--green-2);margin:0 0 4px}
:root[data-theme="dark"] .dues h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dues h2{color:var(--gold)}}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green-2)}

/* lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .name{font-weight:600}
.medal{font:800 20px var(--display);color:var(--gold);width:26px;text-align:center}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.neutral{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.wbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;text-decoration:none;width:100%;box-sizing:border-box}.wbtn svg{width:22px;height:22px}
.letter{font-size:16px;line-height:1.55}.letter h2{font:800 24px/1.2 var(--display);color:var(--green);margin:0 0 12px}
.letter h3{font:700 19px/1.2 var(--display);color:var(--green);margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--gold)}
.letter p{margin:0 0 12px}.letter ul,.letter ol{margin:0 0 12px;padding-left:22px}.letter li{margin:4px 0}
.ethcall{display:flex;gap:12px;align-items:center;margin:0 0 14px;padding:14px 16px;border-radius:14px;background:#fff7e0;border:2px solid var(--gold);color:inherit;text-decoration:none;font-size:16px}.ethcall svg{width:30px;height:30px;flex:none;color:var(--green)}
.ethok{display:flex;gap:12px;align-items:center;font-size:16px}.ethok svg{width:34px;height:34px;flex:none;color:var(--green)}
.ethh{font:700 16px/1.2 var(--display);color:var(--green);margin:14px 0 6px}
.lglogo{display:block;width:96px;height:auto;margin:0 auto 12px;border-radius:12px}
@media print{.tabbar,.noprint,#view main > a.small{display:none!important}body{background:#fff}.letter{box-shadow:none;border:0}}
.tile{display:grid;gap:4px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tile b{font:700 19px var(--display)} .tile span{color:var(--muted);font-size:14px}
.tile .ti{width:38px;height:38px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;color:var(--green-2)}
.tile .ti svg{width:22px;height:22px}

/* tables */
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:700 14px var(--display);text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
th.sort{cursor:pointer}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
input[type=search],input[type=text],input[type=date],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input[type=search]{width:100%}
input[type=number]{width:80px;text-align:right}
.banner{border-radius:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--warn)}
.banner.good{border-left-color:var(--good)}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pagehead h1{font:800 28px/1.1 var(--display);margin:0}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:grid;justify-items:center;gap:2px;padding:10px 4px 12px;color:var(--muted);text-decoration:none;font-size:13px}
.tabbar a svg{width:26px;height:26px}
.tabbar a[aria-current="page"]{color:var(--green-2);font-weight:700}
:root[data-theme="dark"] .tabbar a[aria-current="page"]{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabbar a[aria-current="page"]{color:var(--gold)}}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:85%;border-radius:20px 20px 0 0;padding:18px 16px;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);gap:12px;overflow-y:auto;overflow-x:hidden}
.cime .row input[type=text]{width:0}
.pick{overflow:auto;display:grid}
.pick label{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:20px;height:20px;accent-color:var(--green-2)}

/* quick actions + leadership tools (mirrors FPG More screen) */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa a{display:grid;gap:4px;align-content:end;min-height:132px;padding:18px;border-radius:18px;text-decoration:none;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.qa a svg{width:34px;height:34px;color:var(--green-2);margin-bottom:auto}
.qa a b{font:700 21px/1.1 var(--display)} .qa a span{color:var(--muted);font-size:14px}
.qa a.big{background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;border:0}
.qa a.big svg{color:var(--gold)} .qa a.big span{color:#fff;opacity:.85}
.qa a.goldb{border:2px solid var(--gold)}
.qa a.goldb svg{color:var(--gold)}
.lt{display:grid}
.lt a{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lt a:last-child{border-bottom:0}
.lt .ic{width:50px;height:50px;border-radius:14px;background:var(--green);display:grid;place-items:center;color:var(--gold)}
.lt .ic svg{width:24px;height:24px}
.lt a.gold .ic{background:var(--gold);color:#1d2417}
.lt b{font:700 19px/1.15 var(--display);display:block;color:var(--ink)} .lt span span,.lt a>span:nth-child(2){color:var(--muted);font-size:14px}
.topbar{background:linear-gradient(135deg,var(--green),var(--green-2));color:var(--gold);padding:22px 16px 18px;font:800 26px var(--display);display:flex;align-items:center;gap:12px}
.topbar img{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--gold)}
.lt .chev{color:var(--muted);font-size:22px}
.livepill{display:inline-flex;align-items:center;gap:6px;background:var(--bad);color:#fff;border-radius:999px;padding:2px 10px;font:700 13px var(--display);letter-spacing:1px}
.livepill::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.livepill::before{animation:none}}
.compact th,.compact td{padding:9px 7px}
.compact th{font-size:12.5px}
.grp{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.grp h3{font:700 18px var(--display);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.grp .pl{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.grp select{padding:5px 6px}
.xbtn{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:80px}
.form input,.form select{width:100%}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat3 b{display:block;font:800 24px var(--display)} .stat3 span{font-size:13px;color:var(--muted)}
.req{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.req .amt{font:800 20px var(--display)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
input.sm{width:64px}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1f3a12,#2f5419 60%,#3d6b22);display:grid;place-items:center;padding:20px;overflow:auto}
.gate[hidden]{display:none}
body.gated{overflow:hidden}
.gbox{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4);display:grid;gap:10px;text-align:center}
.gbox h1{margin:0;font:800 28px var(--display)} .gbox .form{text-align:left}
.glogo{width:120px;margin:0 auto;border-radius:12px;border:2px solid var(--gold)}
.loginbox{border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;display:grid;gap:4px}

.avb{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.avb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.whotip{position:absolute;z-index:60;background:#1d2417;color:#fff;border-radius:10px;padding:8px 12px;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;gap:2px;font-size:14px;pointer-events:none}
.whotip b{font:700 16px var(--display);color:var(--gold)} .whotip span{opacity:.9;font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--green-2);text-decoration:underline;font:600 14px var(--body);padding:0;margin:-6px 0 10px;cursor:pointer}
.wholist{display:grid;gap:4px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14.5px}

.dl{font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--gold-soft);margin:0 0 12px}
.dl.late{background:#fde8e6;color:#7a1d16}
.late{color:var(--bad);font-weight:700}
.mebox.off{background:var(--surface);border-color:var(--line)}
.amform{margin:8px 0 12px;border-color:var(--gold)}
.form label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.form label.chk input{width:20px;height:20px;flex:none;margin-top:1px}
.datebox.sm{width:48px;height:48px;border-radius:10px;color:var(--green-2)}
.datebox.sm b{font-size:18px;line-height:1} .datebox.sm span{font-size:11px;color:var(--green-2);opacity:1;font-weight:700;text-transform:uppercase}

.val{border:2px solid var(--gold)} .val.done{border-color:var(--good)}
.vtab{font-size:14px;border-collapse:collapse}
.vtab{width:100%}
.vtab th,.vtab td{padding:3px 1px;text-align:center;border-bottom:1px solid var(--line)}
.vtab .nm{text-align:left;padding-right:4px;max-width:64px;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.vtab .nm small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.vtab .parrow th{color:var(--muted);font-weight:400;font-size:12px}
.vtab .tot{font-weight:800;padding:3px 3px}
.vc{width:24px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:700 14px var(--display);cursor:pointer;color:var(--ink);padding:0}
.fin{color:var(--good)} small.v9{display:block;font-size:10px;color:var(--good)}

.topar{font-weight:700} .topar.u{color:var(--bad)} .topar small{display:block;font-weight:400;color:var(--muted);font-size:11px}
main>*{min-width:0}
.compact.lb{font-size:14.5px}
.compact.lb th,.compact.lb td{padding:9px 4px}
.compact.lb th{font-size:11.5px;letter-spacing:.2px}
.compact.lb td:nth-child(2){max-width:96px;overflow:hidden;text-overflow:ellipsis}
.scm{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:grid;place-items:center;padding:14px;overflow:auto}
.scm .box{background:var(--surface);color:var(--ink);border-radius:18px;max-width:440px;width:100%;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.scm .hd{background:var(--green-2);color:#fff;padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.scm .hd b{font:800 20px var(--display)} .scm .hd small{display:block;opacity:.85;font-size:13px}
.scm .x{background:rgba(255,255,255,.18);color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.scm .tl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 4px}
.scm .tl div{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.scm .tl span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.scm .tl b{font:800 24px var(--display);color:var(--green-2)}
.scm .hg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 14px}
.scm .hg div{background:var(--bg);border-radius:10px;text-align:center;padding:5px 0 4px;font-size:11.5px;color:var(--muted)}
.scm .hg b{display:grid;place-items:center;margin:2px auto;width:30px;height:30px;border-radius:8px;font:800 18px var(--display);color:var(--ink)}
body.pubmode .tabbar,body.pubmode #sheet,body.pubmode .app:not(#pubview){display:none!important}
.scm .hg em{display:block;font-style:normal;font-weight:700;color:var(--ink)}
.scm .hg .sum{background:var(--green-2);color:rgba(255,255,255,.85);font-weight:700}
.scm .hg .sum b{color:#fff} .scm .hg .sum em{color:#fff}
.scm .tot{margin:8px 14px 0;background:var(--green-2);color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.scm .tot span{font-size:12px;font-weight:800;letter-spacing:.4px;opacity:.9}
.scm .tot b{font:800 20px var(--display)} .scm .tot small{font-size:12px;font-weight:700;opacity:.85}
.askwrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:20px}
.askbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.askbox p{margin:0 0 14px;font-size:17px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.linkbtn.danger{color:var(--bad)}
.gchips{display:inline-flex;gap:6px;margin-left:8px;flex-wrap:wrap}
.gchip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font:700 12.5px var(--body);cursor:pointer;text-decoration:line-through}
.gchip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;text-decoration:none}
.gline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
.mebox{flex-wrap:wrap}
.pkrow{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line)}
.pkrow label{border-bottom:0!important;flex:1}

.cime{display:grid;gap:8px}
.mebox{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold)}
.av.g{background:var(--gold);color:#1d2417}

.cbar{background:#9cc58f;color:#1d2417;text-align:center;font:700 19px var(--display);padding:8px;border-radius:10px}
.steps{border:1px solid #b9d7ae;border-radius:12px;overflow:hidden;background:var(--surface)}
.st{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.st.alt{background:var(--gold-soft)}
.st b{font:700 21px var(--display);color:var(--green-2)}
:root[data-theme="dark"] .st b{color:var(--gold)}
.stepper{display:flex;align-items:stretch;border:1px solid #888;border-radius:6px;overflow:hidden;flex:none}
.stepper button{width:56px;background:#2b2b2b;color:#fff;border:0;font:700 28px var(--display);cursor:pointer}
.stepper button:active{background:#000}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{width:58px;display:grid;place-items:center;font:800 32px var(--display);background:#fff;color:#111}
.stepper output{transition:background .15s}
.s-dea{background:#1f8a3b!important;color:#fff!important}
.s-eag{background:#1f5fbf!important;color:#fff!important}
.s-bir{background:#c62828!important;color:#fff!important}
.s-bog{background:#f08c1a!important;color:#1d1d1d!important}
.s-dbl{background:#8fd0f2!important;color:#1d1d1d!important}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:12.5px}
.legend span{padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.btn.big{padding:12px 40px;font-size:20px}
.pick2{display:grid}
.pick2 label{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;font:700 19px var(--display);color:var(--green-2)}
.pick2 label.on{background:var(--gold-soft)}
.pick2 input{width:24px;height:24px;accent-color:var(--green-2)}
.skins td.wrap{white-space:normal;min-width:120px;font-size:13.5px}
.skins tr.won td{background:var(--gold-soft)}
tr.sub td{border-top:0}

.holes{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:12px 0 8px}
.holes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font:700 14px var(--display);cursor:pointer;color:var(--ink)}
.holes button.done{background:var(--gold-soft);border-color:var(--gold)}
.holes button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.holehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.holehead div{text-align:center} .holehead b{display:block;font:800 26px var(--display)} .holehead span{color:var(--muted);font-size:14px}
.holehead .btn{padding:8px 16px;font-size:20px}
tr.tap{cursor:pointer}
.sc{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.sc span{display:grid;justify-items:center;font-size:12px}
.sc i{color:var(--muted);font-style:normal} .sc b{font:700 15px var(--display);width:24px;height:24px;display:grid;place-items:center;border-radius:6px}
.sc em{font-style:normal;color:var(--muted)}

.pargrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pargrid label{display:grid;justify-items:center;gap:2px;font-size:12px} .pargrid i{font-style:normal;color:var(--muted)}
.pargrid input{width:100%;padding:6px 2px;text-align:center}


@media (max-width:380px){.hero h1{font-size:23px}.next .course{font-size:24px}.datebox{width:84px;height:84px}}

.gsug:empty{display:none}
.gsug button{text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--gold-soft);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.gsug button span{display:block;font-size:13px;color:var(--muted)}
.gsug .gpicked{font-size:14px;padding:4px 2px}
.mt{width:100%;border-collapse:collapse;font-size:15px}
.mt th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px}

.mt td b{font-size:17px}

.mt td.lead{background:var(--gold-soft)}

.hg{display:grid;grid-template-columns:64px repeat(9,minmax(0,1fr));gap:2px;font-size:13px;text-align:center;margin-top:6px}
.hg span{padding:4px 0;border-radius:6px}
.hg .hn{color:var(--muted);font-size:12px}
.hg .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hg .best{background:var(--gold-soft);font-weight:800}

function quotaBefore(p, s, date){
  const seq = [...p.prior, ...Object.entries(s).filter(([d,v])=>typeof v==='number' && d<date).sort((a,b)=>a[0].localeCompare(b[0])).map(e=>e[1])];
  return seq.length>=3 ? Math.round(seq.slice(-3).reduce((a,b)=>a+b,0)/3) : null;
}
function stats(p){
  const s = scoresFor(p);
  const played = Object.entries(s).filter(([,v])=>typeof v==='number').sort((a,b)=>a[0].localeCompare(b[0]));
  const vals = played.map(x=>x[1]);
  let beat = 0, tries = 0;
  played.forEach(([d,v]) => { const q = quotaBefore(p,s,d); if (q!==null){ tries++; if (v>=q) beat++; } });
  const seq=[...p.prior,...vals];
  return { vals, played, rounds:vals.length, avg: vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null,
    best: vals.length? Math.max(...vals) : null, beat, tries, last: played.length? played[played.length-1][0] : null,
    quota: seq.length>=3 ? Math.round(seq.slice(-3).reduce((a,b)=>a+b,0)/3) : null,
    noShows: Object.values(s).filter(v=>v==='NS').length };
}

  Object.keys(x).forEach(f2=>{ if (f2!=='name' && x[f2]!=null && f[f2]==null) f[f2]=x[f2]; }); return false; }); })();
const DUES = (()=>{ const m={}; SEED.membership.forEach(x=>{ const k=key(x.name); if (!m[k]) m[k] = x; }); return m; })();
function duesFor(p){ return DUES[key(p.name)] || null; }
function teeHour(t){ const m = String(t||'').match(/(\d{1,2})(\d{2})/); return m ? [+m[1], +m[2]] : [8,0]; }
function fmtTee(t){ const [h,m] = teeHour(t); const ap = h>=12?'PM':'AM'; return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap}`; }
function nextRound(){ const t=todayISO(); return SEED.schedule.find(r=>r.date>=t && !(r.cancelled || /cancel/i.test(r.notes||''))) || null; }
function pendingRound(){ const have=new Set(allRounds().map(r=>r.date)), t=todayISO(); return [...SEED.schedule].reverse().find(r=>r.date<t && !have.has(r.date) && !/closed|cancel/i.test(r.notes)) || null; }
function countdown(r){
  const [h,m] = teeHour(r.time); const tee = new Date(r.date+'T00:00:00'); tee.setHours(h,m,0,0);
  const ms = tee - new Date(); if (ms <= 0) return '<b>Today</b>';
  const hrs = Math.floor(ms/3.6e6);
  return hrs < 48 ? `<b>${hrs}</b> hours away` : `<b>${Math.floor(hrs/24)}</b> days, <b>${hrs%24}</b> hours away`;
}

  let t = `3G ${sr?'side round ':''}payouts · ${fmt(sr?sr.date:d,{month:'short',day:'numeric'})} ${r?r.course:''}` + (q.off ? '' : `\nQuota game (pot ${money$(q.pot)}, ${q.n} in)\n` + (q.pays.map(x=>`${x.tie?'T':''}${x.place}. ${sname(x.pid)} ${x.plus>=0?'+':''}${x.plus} · ${money$(x.amt)}`).join('\n') || 'No winners'));
  if (k) t += `\n\nSkins (pot ${money$(k.pot)})\n` + (k.winners.map(w=>`${sname(w.pid)} ${w.n} skin${w.n>1?'s':''} · ${money$(w.amt)}`).join('\n') || 'No skins won');

/* ---------- Dues payments recorded in the app (layered over the spreadsheet) ----------
   Each payment is saved as dues/<member>_<year>. The spreadsheet values stay underneath,
   so "Mark unpaid" or a corrected entry simply replaces what the sheet had. */
const DUES_ORIG = new WeakMap();
const DUES_FEE = 25;
const duesId = (name, y) => key(name).replace(/ /g,'-') + '_' + y;
const mdy = iso => { const m=String(iso||'').match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${m[2]}/${m[3]}/${m[1]}` : ''; };
function applyDues(){
  SEED.membership = SEED.membership.filter(m=>!m._app);
  SEED.membership.forEach(m=>{ const o=DUES_ORIG.get(m); if (o) Object.assign(m,o); });
  Object.values(S.duesPay||{}).forEach(d=>{
    if (!d || !d.name || !d.year) return;
    const k=key(d.name); let m=SEED.membership.find(x=>key(x.name)===k);
    if (!m){ m={name:d.name, _app:true}; SEED.membership.push(m); }
    if (!DUES_ORIG.has(m)) DUES_ORIG.set(m, {});
    const o=DUES_ORIG.get(m), y='y'+d.year, mo='memo'+d.year;
    if (!(y in o)){ o[y]=m[y]??null; o[mo]=m[mo]??null; }
    const paid = +d.amount>0;
    m[y] = paid ? +d.amount : null;
    m[mo] = paid ? [mdy(d.paidOn), d.method, d.note].filter(Boolean).join(' ') : null;
  });
  Object.keys(DUES).forEach(k=>delete DUES[k]); SEED.membership.forEach(x=>{ const k=key(x.name); if (!DUES[k]) DUES[k]=x; });
}
function dpNames(){
  const m=new Map(); SEED.membership.forEach(x=>m.set(key(x.name), x.name));
  Object.values(PBY).forEach(p=>{ if (!p.guest && !p.inactive && !m.has(key(p.name))) m.set(key(p.name), p.name); });
  return [...m.values()].sort((a,b)=>shortName(a).localeCompare(shortName(b)));
}

const cnorm = x => String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function courseExact(name){
  const n = cnorm(name); if (!n) return null;
  for (const [k,c] of Object.entries((typeof S!=='undefined' && S.courses) || {})) if (c && (cnorm(c.name)===n || (c.aliases||[]).some(a=>cnorm(a)===n))) return k;
  for (const [k,c] of Object.entries(COURSE_SEED)) if (cnorm(c.name)===n) return k;
  return null;
}
function courseKey(name){
  const ex = courseExact(name); if (ex) return ex;
  const n = String(name||'').toLowerCase().replace(/[^a-z]/g,'');
  if (/heritage|hetitage/.test(n)) return /lutz/.test(n) ? 'heritageharbor' : 'heritagebradenton';
  if (/eagle/.test(n)) return 'eagleslakes';
  if (/chichi/.test(n)) return 'chichi';
  if (/clearwater/.test(n)) return 'clearwater';
  if (/cleveland/.test(n)) return 'clevelandheights';
  if (/summerfield/.test(n)) return 'summerfield';
  if (/lexington/.test(n)) return 'lexingtonoaks';
  if (/macdill/.test(n)) return 'macdill';
  for (const k of Object.keys(COURSE_SEED)) if (n.includes(k)) return k;
  return n || null;
}
function courseInfo(name){ return courseInfoK(courseKey(name), name); }
function courseInfoK(k, name){
  const db = S.courses[k];
  const seed = COURSE_SEED[k] || {name: (db && db.name) || name, pars:null};
  const nm = (db && db.name) || seed.name;
  if (db && Array.isArray(db.pars) && db.pars.length===18) return {key:k, name:nm, pars:db.pars, src:'club', by:db.by};
  return {key:k, ...seed, name:nm};
}

const PT_DEFAULT = {albatross:8, eagle:6, birdie:4, par:2, bogey:1, double:0, worse:0, confirmed:true};
function ptTable(){ const s=S.points; return s ? {...PT_DEFAULT, ...s} : {...PT_DEFAULT}; }
function holePts(gross, par){
  const T = ptTable(), d = gross - par;
  return d<=-3 ? T.albatross : d===-2 ? T.eagle : d===-1 ? T.birdie : d===0 ? T.par : d===1 ? T.bogey : d===2 ? T.double : T.worse;
}

const parStr = n => n==null ? '—' : n===0 ? 'E' : (n>0?'+':'')+n;
const LABEL = d => d<=-3?'Dbl eagle':d===-2?'Eagle':d===-1?'Birdie':d===0?'Par':d===1?'Bogey':d===2?'Double':'Triple+';
function cardTotals(holes, pars){

function skinsFor(d){
  const pars = courseInfo(schedFor(d)?.course).pars;
  const L = S.live[d] || {}, players = Object.values(L).filter(x=>x.holes && Object.keys(x.holes).length && inGameOn(d, x.pid, 'skins'));
  const holes = [];
  for (let h=1; h<=18; h++){
    const sc = players.filter(x=>x.holes[h]>0).map(x=>({pid:x.pid, g:+x.holes[h]}));
    if (!sc.length){ holes.push({h, low:null, win:[], ties:[], solo:[]}); continue; }
    const low = Math.min(...sc.map(s=>s.g)), at = sc.filter(s=>s.g===low).map(s=>s.pid);
    const okPar = !pars || low <= pars[h-1];
    holes.push({h, low, over: !okPar, win: at.length===1 && okPar ? at : [], ties: at.length>1?at:[], solo: at.length===1 && !okPar ? at : []});

  const by = {}; holes.forEach(x=>x.win.forEach(p=>{ by[p]=(by[p]||0)+1; }));
  return {holes, pot, won, value, players:players.length, winners:Object.entries(by).map(([pid,n])=>({pid,n,amt:payR(n*value)})).sort((a,b)=>b.n-a.n)};

function roundDiff(P){ const parts=[]; const q=P.q, k=P.k, c=P.c;

  if (k && k.winners.length) parts.push(['Skins', k.pot - k.winners.reduce((a,x)=>a+x.amt,0)]);
  if (c && c.won) parts.push(['Closest to the pin', c.pot - c.pay*c.won]);
  const net = Math.round(parts.reduce((a,x)=>a+x[1],0)*100)/100;
  return {parts:parts.filter(x=>Math.abs(x[1])>0.004), net}; }

function ctpFor(d, pars){

function quotaGame(d, rows){
  if (SIDE_KEY(d)) return {pot:0, share:0, split:[], n:0, pays:[], unranked:0, ctpOnly:0, off:true};   // side rounds have no quota game
  const G=gamesFor(d), share=G.ctp-G.ctpShare, split=G.qSplit||[60,30,10];
  const inAll = rows.filter(r=>inGameOn(d, r.pid, 'ctp'));
  const inG = inAll.filter(r=>quotaOn(r.pid, d)!==null);          // no quota = closest to the pin only, not in the quota pot
  const field = inG.filter(r=>r.plus!==null).sort((a,b)=>b.plus-a.plus);
  const pot = share*inG.length, pays=[]; let i=0;
  while (i<field.length && i<split.length){
    const tied=field.filter(x=>x.plus===field[i].plus), pct=split.slice(i,i+tied.length).reduce((a,b)=>a+b,0);
    tied.forEach(x=>pays.push({pid:x.pid, place:i+1, tie:tied.length>1, pct:Math.round(pct/tied.length*10)/10, plus:x.plus, pts:x.pts, amt:payR(pot*pct/100/tied.length)}));
    i+=tied.length;
  }
  return {pot, share, split, n:inG.length, pays, unranked: inG.length-field.length, ctpOnly: inAll.length-inG.length};
}

const MKEY = d => '3g-match-'+d;   // d is the Wednesday date, or 'sr:<id>' for a side round
const mKnown = id => !!(PBY[id] || SIDEN[id]);
const mFull = id => PBY[id] ? shortName(PBY[id].name) : (SIDEN[id] ? sideFull(id) : '');

function matchPool(d, L){ const s=new Set(d===S.ciDate ? playingIds() : []); Object.keys(L||{}).forEach(id=>s.add(id)); return [...s].filter(mKnown); }
function nineTot(holes, pars, hs){ let st=0, tp=0, n=0; hs.forEach(h=>{ const g=+(holes||{})[h]; if (g>0 && pars){ st+=g; tp+=g-pars[h-1]; n++; } }); return {st, tp, n}; }
function matchHTML(d, L, pars, rows){

  }
  const ids=[...new Set([...(me&&pool.includes(me)?[me]:[]), ...saved])];
  const data=ids.map(id=>{ const H=L[id]?.holes||{}; return {id, H, f:nineTot(H,pars,NINE.front), b:nineTot(H,pars,NINE.back), t:nineTot(H,pars,[...NINE.front,...NINE.back])}; });
  const leadSet = k => { const c=data.filter(x=>x[k].n>0); if (c.length<2) return new Set(); const lo=Math.min(...c.map(x=>x[k].tp)); return new Set(c.filter(x=>x[k].tp===lo).map(x=>x.id)); };
  const LF=leadSet('f'), LB=leadSet('b'), LT=leadSet('t');
  const cell = (x,k,ls) => { const v=x[k], full=k==='t'?18:9; if (!v.n) return '<td><span class="muted">—</span></td>';
    return `<td class="${ls.has(x.id)?'lead':''}"><b>${v.st}</b><small>${parStr(v.tp)}${v.n<full?` · thru ${v.n}`:''}</small></td>`; };
  const order=[...data].sort((a,b)=>(a.t.n?a.t.tp:999)-(b.t.n?b.t.tp:999));
  const grid = hs => { const best={}; hs.forEach(h=>{ const g=data.map(x=>+x.H[h]).filter(v=>v>0); if (g.length>1){ const lo=Math.min(...g); if (g.filter(v=>v===lo).length===1) best[h]=lo; } });
    return `<div class="hg"><span></span>${hs.map(h=>`<span class="hn">${h}</span>`).join('')}${order.map(x=>`<span class="nm">${esc(sname(x.id))}</span>${hs.map(h=>{ const g=+x.H[h]; return `<span class="${g>0&&best[h]===g?'best':''}">${g>0?g:'·'}</span>`; }).join('')}`).join('')}</div>`; };
  return `<section class="card"><div class="pagehead"><h2 style="margin:0">My match</h2><span class="row" style="gap:6px"><button class="btn ghost" id="mEdit" style="padding:6px 12px">Change players</button><button class="btn ghost danger" id="mEnd" style="padding:6px 12px">End match</button></span></div>
  ${S.mConfirm?`<div class="banner" style="margin-top:8px"><b>End this match?</b> Your side-bet view clears. Scores are not affected.<div class="row" style="margin-top:8px"><button class="btn ghost danger" id="mEndYes">Yes, end match</button><button class="btn ghost" id="mEndNo">Keep match</button></div></div>`:''}
  <div class="small muted">Lowest score wins each part. ★ marks who's ahead, compared to par so it's fair mid-round.</div>

  ${pars ? `<h3 style="margin:14px 0 0;font-size:15px">Front 9</h3>${grid(NINE.front)}<h3 style="margin:12px 0 0;font-size:15px">Back 9</h3>${grid(NINE.back)}<div class="small muted" style="margin-top:6px">Highlighted = lowest score on the hole.</div>` : '<div class="small muted">Hole-by-hole scores show once the course pars are set.</div>'}
  <div class="small muted" style="margin-top:10px">Private to you. ${SIDE_KEY(d)?'Only for this side round — your Wednesday match is separate.':"Clears after today's round."}</div></section>`;

/* ---- Score my group (pick players at the course, then score hole by hole) ---- */

document.addEventListener('click', e=>{ const b=e.target.closest('[data-pgrp]'); if (!b) return;
  const d=roundDate(), P=S.pairings[d]; if (!P) return; const inR=new Set([...Object.keys(S.checkins), ...Object.keys(S.guestsIn||{})]);

function myGroup(d){ if (S.myGroup && S.myGroup.d===d) return S.myGroup.ids; try{ const v=JSON.parse(localStorage.getItem(GKEY(d))||'null'); if (Array.isArray(v)){ S.myGroup={d,ids:v}; return v; } }catch(e){} return null; }

/* ---- 9 / 18 hole score validation ---- */
const NINE = {front:[1,2,3,4,5,6,7,8,9], back:[10,11,12,13,14,15,16,17,18]};
function nineDone(L, ids, n){ return ids.length && ids.every(id=>NINE[n].every(h=>L[id]?.holes?.[h]!=null)); }
function valPanel(d, ids, pars, n){

  <div class="small" id="valMsg" role="status" style="text-align:center"></div></section>`;

V.score = () => {
  const d = roundDate(), sch = schedFor(d), C = courseInfo(sch?.course), pars = C.pars, L = S.live[d] || {};
  ensureLive(d);
  const inRound = new Set(d===S.ciDate ? [...Object.keys(S.checkins), ...Object.keys(S.guestsIn||{})] : []);
  const lim = scoreScope(d, inRound), okId = id => !lim || lim.allowed.has(id);
  const ids0 = myGroup(d), ids = ids0 ? ids0.filter(id=>inRound.has(id) && PBY[id] && okId(id)) : null;
  const head = `<div class="cbar">${esc(C.name||sch?.course||'Course')}</div>` + sideNudge(d);
  if (lim && lim.mine<0) return `<main>${back()}${head}<h1 style="margin:0;font:800 24px var(--display)">You're not in a group for this round</h1>
    <div class="banner" style="margin-top:10px">Only players in a pairing group can score. Ask a leader to add you to a group, then come back here.</div>
    <div class="row"><a class="btn ghost" href="#leaderboard">See the leaderboard</a></div></main>`;
  if (!ids || !ids.length || S.pickOpen){
    const sel = new Set((S.pick || ids || []).filter(id=>inRound.has(id)));
    const q = (S.pq||'').toLowerCase();
    const R = [...inRound].filter(id=>PBY[id] && okId(id)).sort((a,b)=>sname(a).localeCompare(sname(b))).sort((a,b)=>sname(a).localeCompare(sname(b))).filter(id=>!q || sname(id).toLowerCase().includes(q) || PBY[id].name.toLowerCase().includes(q));
    return `<main>${back()}${head}<h1 style="margin:0;font:800 24px var(--display)">Select up to five players to score for</h1>
    <div class="muted small">${fmt(d,{weekday:'long',month:'short',day:'numeric'})} · ${inRound.size} checked in · ${sel.size} selected</div>${dbNote()}
    ${S.dbStatus==='ready' && !inRound.size ? `<div class="banner">Nobody is checked in for this round yet. Players (and their guests) must check in on the home screen before they can be scored.</div>` : (lim ? '<div class="small muted">You can score your own group, plus anyone checked in who isn’t in a group yet.</div>' : '<div class="small muted">Only players and guests checked in for this round appear here.</div>')}
    ${pairGroupsHTML(d, inRound)}
    <input type="search" id="pq" value="${esc(S.pq||'')}" placeholder="Find a player" aria-label="Find a player">
    <div class="row"><button class="btn" id="pickGo" ${sel.size?'':'disabled'}>Start scoring</button>${ids?'<button class="btn ghost" id="pickCancel">Cancel</button>':''}</div>
    <div class="card" style="padding:0 14px"><div class="pick2">${R.map(id=>`<label class="${sel.has(id)?'on':''}"><input type="checkbox" data-pk="${id}" ${sel.has(id)?'checked':''} ${!sel.has(id)&&sel.size>=5?'disabled':''}><span>${esc(sname(id))}</span><span class="muted small">${esc(shortName(PBY[id].name))}</span></label>`).join('')}</div></div></main>`;
  }
  if (!pars) return `<main>${back()}${head}<div class="banner">No hole pars on file for this course yet. Leadership can add them under <a href="#courses">Course Pars</a>, or scores can be entered as totals in <a href="#scorekeeper">Enter Totals</a>.</div></main>`;
  const hole = S.lbHole || 1, par = pars[hole-1];
  const dr = (S.draft && S.draft.d===d && S.draft.h===hole) ? S.draft : (S.draft = {d, h:hole, v:Object.fromEntries(ids.map(id=>[id, L[id]?.holes?.[hole] ?? par]))});
  ids.forEach(id=>{ if (!(id in dr.v)) dr.v[id] = L[id]?.holes?.[hole] ?? par; });
  const saved = id => L[id]?.holes?.[hole]!=null;
  const needFront = nineDone(L, ids, 'front') && ids.some(id=>!L[id]?.v9);
  const needBack = !needFront && nineDone(L, ids, 'back') && ids.some(id=>!L[id]?.final);
  const isFinal = ids.length && ids.every(id=>L[id]?.final);

async function saveLive(){
  const d=roundDate(), sch=schedFor(d), pars=courseInfo(sch?.course).pars, L=S.live[d]||{}, hole=S.lbHole||1, inR=new Set([...Object.keys(S.checkins), ...Object.keys(S.guestsIn||{})]), ids=(myGroup(d)||[]).filter(id=>inR.has(id));
  const msg=live$('scMsg'); msg.textContent='Saving…'; let n=0;
  const ctpElig = pars[hole-1]===3 ? ids.filter(id=>inGame(id,'ctp') && Math.min(S.draft.v[id], pars[hole-1]+2)<=pars[hole-1]) : [];
  try{
    let changedFront=false, changedBack=false;
    for (const id of ids){ const g=Math.min(S.draft.v[id], pars[hole-1]+2); const holes={...(L[id]?.holes||{})}; if (holes[hole]===g && L[id]) continue; holes[hole]=g; const t=cardTotals(holes,pars);
      const doc={...(L[id]||{}), pid:id, holes, pts:t.pts, thru:t.thru, gross:t.gross, toPar:t.toPar, at:new Date().toISOString(), by:S.meFull||''};
      if (hole<=9 && doc.v9){ delete doc.v9; changedFront=true; } if (doc.v18||doc.final){ if (hole>=10 || doc.final){ delete doc.v18; delete doc.final; changedBack=true; } }
      await S.db.doc(`live/${d}/players/${id}`).set(doc); n++; }
    const L2=S.live[d]||{}, fDone=nineDone(L2, ids, 'front'), bDone=nineDone(L2, ids, 'back');
    const stayCtp = ctpElig.length>0;
    if (hole<18 && !(hole===9 && fDone) && !stayCtp){ S.lbHole=hole+1; S.draft=null; }
    render();
    if (stayCtp){ live$('scMsg').textContent=`Hole ${hole} saved.`; const box=document.getElementById('ctpBox'); if (box){ box.scrollIntoView({block:'center'}); }
      live$('ctpMsg').textContent = `Closest to the pin: ${ctpElig.map(sname).join(', ')} made par or better. Enter the distance${ctpElig.length>1?'s':''}, then tap ${hole<18?'Next hole':'Done'}.`; return; }
    if ((hole===9 || changedFront) && fDone && ids.some(id=>!L2[id]?.v9)){ live$('scMsg').textContent=''; scrollTo(0,0); live$('valMsg').textContent='Front 9 complete. Check the scores against the scorecard.'; }
    else if ((hole===18 || changedBack) && bDone && ids.some(id=>!L2[id]?.final)){ live$('scMsg').textContent=''; scrollTo(0,0); live$('valMsg').textContent='All 18 holes in. Check the back 9, then save the round.'; }
    else live$('scMsg').textContent = `Hole ${hole} saved.` + (hole<18?` Now on hole ${S.lbHole}.`:'');
  }catch(e){ live$('scMsg').textContent = noWriteC; }
}

      S.draft=null; render(); live$('scMsg').textContent=`Hole ${h} cleared.`; }

  const d = roundDate();
  const P0=S.pairings[d]; if (!S.pt || S.pt.date!==d || (!S.pt.dirty && P0 && P0.savedAt!==S.pt.from)){ const P=P0; S.pt = {date:d, groups: P ? P.groups.map(g=>[...g]) : [], interval: P?.interval || 8, dirty:false, from:P?.savedAt}; }
  return S.pt;

function makeGroups(ids, mode){
  const n = ids.length, g = Math.max(1, Math.ceil(n/4));
  let list = [...ids];
  if (mode==='random'){ for (let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; } }
  else { const qs = list.map(curQuota).filter(q=>q!==null).sort((a,b)=>a-b); const med = qs.length?qs[Math.floor(qs.length/2)]:0; list.sort((a,b)=>(curQuota(b)??med)-(curQuota(a)??med)); }
  const G = Array.from({length:g},()=>[]);
  list.forEach((id,i)=>{ const row=Math.floor(i/g), col=i%g; G[mode==='random'||row%2===0?col:g-1-col].push(id); });
  return G;
}

/* ---- profile photo: crop to a square, shrink to a small thumbnail on the phone, save in Firestore ---- */
function shrinkPhoto(file, size=192){
  return new Promise((ok, bad)=>{ const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(url); const s=Math.min(im.naturalWidth, im.naturalHeight); if (!s) return bad(new Error('empty'));
      const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
      x.imageSmoothingQuality='high'; x.drawImage(im, (im.naturalWidth-s)/2, (im.naturalHeight-s)/2, s, s, 0, 0, size, size);
      let q=.82, out=c.toDataURL('image/jpeg', q); while (out.length>60000 && q>.4){ q-=.12; out=c.toDataURL('image/jpeg', q); } ok(out); };
    im.onerror=()=>{ URL.revokeObjectURL(url); bad(new Error('unreadable')); }; im.src=url; });
}

const composeName = (f,n,l) => n ? `${f} (${n}) ${l}`.trim() : `${f} ${l}`.trim();
function splitName(n){ const w=shortName(n).split(' '); return {first:w[0]||'', last:w.slice(1).join(' '), nick:nick(n)}; }
/* WhatsApp: export active members' phones as a contact card file (.vcf) the phone can import */
function waPhone(raw){ const d=String(raw||'').replace(/\D/g,''); if (!d) return '';
  if (String(raw).trim().startsWith('+')) return '+'+d; if (d.length===10) return '+1'+d; if (d.length===11 && d[0]==='1') return '+'+d; return ''; }
function waExport(){
  const act = SEED.players.filter(p=>!p.guest && !p.inactive && !(S.guestBook||{})[p.id]);
  const vc = v => String(v||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m);
  const ok = [], bad = [];
  act.forEach(p=>{ const ph=waPhone(p.phone); (ph?ok:bad).push({p,ph}); });
  const cards = ok.map(({p,ph})=>{ const n=splitName(p.name);
    return ['BEGIN:VCARD','VERSION:3.0',`N:${vc(n.last)};${vc(n.first)};;;`,`FN:${vc((n.first+' '+n.last).trim())}`, n.nick?`NICKNAME:${vc(n.nick)}`:'', 'ORG:Triple-G (3G)', `TEL;TYPE=CELL:${ph}`, p.email?`EMAIL:${p.email}`:'', 'END:VCARD'].filter(Boolean).join('\r\n'); });
  return {cards, ok, bad};
}
function rebuildSNAME(){
  const base = p => { const nk = nick(p.name); return nk ? nk.replace(/["“”]/g,'') : shortName(p.name).split(' ')[0]; };
  const list = SEED.players.filter(p=>!(S.guestBook||{})[p.id]); const count={};
  list.forEach(p=>{ const b=base(p); count[b]=(count[b]||0)+1; });
  list.forEach(p=>{ const b=base(p); const w=shortName(p.name).split(' '); SNAME[p.id] = count[b]>1 ? `${b} ${w[w.length-1][0]}.` : b; });
}
function applyRoster(){

  });

}

/* ---- Admin: bulk invite (create many logins at once) ---- */
const EMRX = /[^\s@<>,;"']+@[^\s@<>,;"']+\.[^\s@<>,;"']+/;
function biState(){ return S.bi || (S.bi = {map:{}, sel:{}, st:{}, unmatched:[], paste:'', running:false}); }
function biPool(){ return SEED.players.filter(p=>!p.inactive && !p.guest && !(S.guestBook||{})[p.id]); }
function biMatch(name, email){
  const n = name.toLowerCase().replace(/\([^)]*\)/g,' ').replace(/\b(sr|jr|ii|iii)\b\.?/g,' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
  if (!n){ if (!email) return null; const w=email.split('@')[0].toLowerCase().split(/[._\-]+/).filter(x=>/^[a-z]{2,}$/.test(x)); return w.length>=2 ? (biMatch(w.join(' ')) || biMatch(w.slice().reverse().join(' '))) : null; }
  const pool = biPool(), k = key(n);
  let hit = pool.filter(p=>key(p.name)===k || key(p.display||'')===k);
  if (hit.length!==1) hit = pool.filter(p=>nick(p.name) && nick(p.name).toLowerCase().replace(/[^a-z ]/g,'').trim()===n);
  if (hit.length!==1){ const w=n.split(' '); if (w.length>1){ const f=w[0][0], l=w[w.length-1]; hit = pool.filter(p=>{ const s=splitName(p.name); return s.last.toLowerCase().replace(/[^a-z ]/g,'').split(' ').pop()===l && s.first.toLowerCase().startsWith(f); }); } }
  return hit.length===1 ? hit[0] : null;
}
function biEmail(p){ const b=biState(); return (b.map[p.id] ?? p.email ?? '').trim().toLowerCase(); }
V.adminvite = () => {
  const b = biState(), linked = new Set(Object.values(S.users||{}).map(u=>u.pid));
  const pool = biPool().filter(p=>!linked.has(p.id)).sort((x,y)=>(x.guest-y.guest) || shortName(x.name).localeCompare(shortName(y.name)));
  const have = biPool().filter(p=>linked.has(p.id)).length;
  const ok = p => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(biEmail(p));
  const isSel = p => b.sel[p.id] ?? ok(p);
  const n = pool.filter(p=>isSel(p) && ok(p) && b.st[p.id]!=='done').length;
  return `<main><a href="#admin" class="small">← Admin</a><div class="pagehead"><h1>Bulk Invite</h1></div>${dbNote()}
  <div class="muted">Creates a login for each checked member and emails them a link to set their password. ${have} member${have===1?' already has a login':'s already have logins'}.</div>
  <section class="card"><h2>1. Paste emails (optional)</h2>
    <div class="small muted" style="margin-bottom:8px">Copy the name and email columns from the scorebook, or a contact list, and paste here. One person per line, like <b>Calvin Smith, calvin@email.com</b>. Or skip this and type emails in the list below.</div>
    <textarea id="biPaste" rows="5" style="width:100%;box-sizing:border-box;font:14px var(--body)" placeholder="Name, email&#10;Name, email">${esc(b.paste)}</textarea>
    <button class="btn" id="biMatch" style="margin-top:8px">Match to members</button>
    ${b.unmatched.length?`<div class="banner" style="margin-top:10px"><b>Couldn’t match ${b.unmatched.length}:</b> ${b.unmatched.map(esc).join('; ')}. Type those emails in the list below.</div>`:''}
  </section>
  <section class="card"><h2>2. Check who to invite</h2>
    <div class="row" style="margin-bottom:6px"><button class="linkbtn" id="biAll">Check all with email</button><button class="linkbtn" id="biNone">Uncheck all</button></div>
    <div class="list">${pool.length ? pool.map(p=>{ const st=b.st[p.id]||''; return `<div class="li" style="grid-template-columns:auto 1fr;align-items:center">
      <input type="checkbox" data-bisel="${p.id}" ${isSel(p)&&st!=='done'?'checked':''} ${st==='done'?'disabled':''} aria-label="Invite ${esc(shortName(p.name))}" style="width:20px;height:20px">
      <div><div class="name">${esc(shortName(p.name))}${p.guest?' <span class="pill neutral">Guest</span>':''}</div>
        <input type="email" data-biem="${p.id}" value="${esc(biEmail(p))}" placeholder="email" ${st==='done'?'disabled':''} style="width:100%;box-sizing:border-box;margin-top:4px" aria-label="Email for ${esc(shortName(p.name))}">
        <div class="small" id="bist-${p.id}">${st==='done'?'<span class="pill good">Invited</span>':st?esc(st):''}</div></div></div>`; }).join('') : '<div class="li"><span class="muted">Everyone active already has a login.</span></div>'}</div>
  </section>
  <section class="card"><h2>Just save the emails?</h2>
    <div class="small muted" style="margin-bottom:8px">Saves each email above to the member's profile. <b>No logins are created and no emails are sent.</b> You can invite people later.</div>
    <button class="btn" id="biSaveOnly" ${S.dbStatus==='ready'&&!b.running?'':'disabled'}>Save emails to profiles only</button>
    <div class="small" id="biSaveMsg" role="status"></div>
  </section>
  <section class="card"><h2>3. Send</h2>
    <div class="small muted" style="margin-bottom:8px">Everyone is added as a Member. Change anyone to Leader later in Members → Edit. The emails may land in spam, so give the group a heads-up.</div>
    <button class="btn gold big" id="biGo" ${n&&!b.running&&S.dbStatus==='ready'?'':'disabled'}>${b.running?'Sending…':`Create ${n} login${n===1?'':'s'} &amp; send invites`}</button>
    <div class="small" id="biMsg" role="status"></div>
  </section></main>`;
};
document.addEventListener('input', e=>{
  const t=e.target; if (!S.bi) biState();
  if (t.id==='biPaste') S.bi.paste=t.value;
  else if (t.dataset && t.dataset.biem){ S.bi.map[t.dataset.biem]=t.value; const cb=document.querySelector(`[data-bisel="${t.dataset.biem}"]`); if (cb && EMRX.test(t.value) && S.bi.sel[t.dataset.biem]===undefined) cb.checked=true; }
});
document.addEventListener('change', e=>{ const t=e.target; if (t.dataset && t.dataset.bisel){ biState().sel[t.dataset.bisel]=t.checked; render(); } });
document.addEventListener('click', async e=>{
  const t=e.target.closest('#biMatch,#biAll,#biNone,#biGo,#biSaveOnly'); if (!t) return; const b=biState();
  if (t.id==='biSaveOnly'){
    const list = biPool().filter(p=>{ const em=biEmail(p); return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) && em!==(p.email||'').toLowerCase(); });
    if (!list.length){ live$('biSaveMsg').textContent='No new or changed emails to save.'; return; }
    const dupes = list.map(biEmail).filter((x,i,a)=>a.indexOf(x)!==i);
    if (dupes.length){ live$('biSaveMsg').textContent=`The same email is used twice: ${[...new Set(dupes)].join(', ')}. Fix that first.`; return; }
    if (!await ask(`Save ${list.length} email${list.length===1?'':'s'} to member profiles? No logins are created and nothing is emailed.`)) return;
    t.disabled=true; let ok=0, bad=[];
    for (const p of list){ const em=biEmail(p), sp=splitName(p.name), r=(S.roster||{})[p.id]||{};
      try{ await S.db.doc('roster/'+p.id).set({id:p.id, first:r.first??sp.first, last:r.last??sp.last, nick:r.nick??sp.nick, phone:p.phone||'', email:em, member:!p.guest, auto:!!p.auto, inactive:!!p.inactive, by:S.meFull||'', at:new Date().toISOString()}); p.email=em; ok++; }
      catch(err){ bad.push(shortName(p.name)); } }
    render(); live$('biSaveMsg').textContent = `Saved ${ok} email${ok===1?'':'s'} to profiles. No invites were sent.` + (bad.length?` Couldn’t save: ${bad.join(', ')}.`:'');
    return; }
  if (t.id==='biMatch'){
    b.unmatched=[]; let got=0;
    b.paste.split(/\r?\n/).forEach(line=>{ const m=line.match(EMRX); if (!m) return; const email=m[0].toLowerCase();
      const name=line.replace(new RegExp(EMRX.source,'g'),' ').replace(/[\t,;:<>"'|]/g,' ').trim(); const p=biMatch(name, email);
      if (p){ b.map[p.id]=email; delete b.sel[p.id]; got++; } else b.unmatched.push(name ? `${name} (${email})` : email); });
    render(); live$('biMsg').textContent = `Matched ${got} email${got===1?'':'s'}.`; return; }
  if (t.id==='biAll'){ biPool().forEach(p=>{ delete b.sel[p.id]; }); render(); return; }
  if (t.id==='biNone'){ biPool().forEach(p=>{ b.sel[p.id]=false; }); render(); return; }
  if (t.id==='biGo'){
    const F=window.TG_FB; if (!F) return;
    const linked = new Set(Object.values(S.users||{}).map(u=>u.pid)), used = new Set(Object.values(S.users||{}).map(u=>u.email));
    const list = biPool().filter(p=>!linked.has(p.id) && (b.sel[p.id] ?? true) && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(biEmail(p)) && b.st[p.id]!=='done');
    const dupes = list.map(biEmail).filter((x,i,a)=>a.indexOf(x)!==i);
    if (dupes.length){ live$('biMsg').textContent=`The same email is used twice: ${[...new Set(dupes)].join(', ')}. Fix that first.`; return; }
    if (!await ask(`Create ${list.length} logins and email each person a link to set their password?`)) return;
    b.running=true; render(); let done=0, bad=0;
    const say = (id,txt) => { const el=document.getElementById('bist-'+id); if (el) el.textContent=txt; };
    for (const p of list){
      const email=biEmail(p);
      if (used.has(email)){ b.st[p.id]='That email is already linked to another member.'; say(p.id,b.st[p.id]); bad++; continue; }
      say(p.id,'Creating login…');
      try{
        const pw = Array.from(crypto.getRandomValues(new Uint8Array(18)), x=>('0'+x.toString(16)).slice(-2)).join('')+'Aa1!';
        const c = await F.createUserWithEmailAndPassword(F.auth2, email, pw); const uid=c.user.uid; await F.signOut(F.auth2);
        await S.db.doc('users/'+uid).set({role:'member', pid:p.id, email, name:shortName(p.name), by:S.meFull, at:new Date().toISOString()});
        await F.sendPasswordResetEmail(F.auth, email);
        if ((p.email||'').toLowerCase()!==email){ const s=splitName(p.name); const r=(S.roster||{})[p.id]||{};
          try{ await S.db.doc('roster/'+p.id).set({id:p.id, first:r.first??s.first, last:r.last??s.last, nick:r.nick??s.nick, phone:p.phone||'', email, member:!p.guest, auto:!!p.auto, inactive:!!p.inactive, by:S.meFull||'', at:new Date().toISOString()}); }catch(_){} }
        b.st[p.id]='done'; used.add(email); done++; say(p.id,'Invited ✓');
      }catch(err){
        b.st[p.id] = err?.code==='auth/email-already-in-use' ? 'That email already has a login. Remove it in Firebase → Authentication → Users, or use Members → Edit.' : err?.code==='auth/too-many-requests' ? 'Firebase paused us for sending too fast. Wait 15 minutes and press Send again.' : ('Could not invite: '+(err?.code||err?.message||'error'));
        say(p.id,b.st[p.id]); bad++; if (err?.code==='auth/too-many-requests') break;
      }
      await new Promise(r=>setTimeout(r,1200));
    }
    b.running=false; render(); live$('biMsg').textContent = `Done: ${done} invited${bad?`, ${bad} need attention (see the notes in the list)`:''}. Tell everyone to check spam.`;
  }
});

/* ---- New Member Welcome Letter (leaders update it each year; stored in settings/welcome) ---- */
const WELCOME_DEFAULT = {year:2026, body:`# Welcome to Triple-G (Gentlemen Golf Group)

Attached you will find information on how our group operates, along with the Triple-G Code of Ethics, which requires your acknowledgement to become a member. All correspondence from us will start with **TRIPLE-G** in the subject line.

Below you will find information to make the most of your membership.

**Triple-G:** A group of people with the common love of golf who are honorable people with integrity and respect for others, along with the game of golf.

## Standard Group Information

Please REPLY ASAP (**DO NOT REPLY ALL**) but **NO LATER THAN SUNDAY 12:00 PM** if you plan on attending, so we don't hold unnecessary tee times.

**Reminder:** If you cannot make your commitment to play, **please notify Chris (Tiger) J 813-992-3485 or Coach 813-943-8199 only, ASAP**, as we may have a player on standby wanting to play in your spot.

- **Group News:** Weekly information or announcements
- **Round of Play:** Results from Wednesday round of play
- **Next Scheduled Round:** Upcoming week round of play, location, tee time and cost

## Excel and Points

For new members, please see the attached Excel included with the weekly email that goes out on Wednesdays or NLT Thursdays. Review the tabs at the bottom of the Excel, which include the **Scores** tab (your points from all your rounds of play), the **Players Points Required** tab (your minimum points needed to score for the next round of play) and the **Golf Schedule** tab (upcoming rounds of play).

**Explanation of Point System:** Your needed points is a combination of your last 3 rounds divided by 3.

**Scoring:** Bogey = 1 point, Par = 2 points, Birdie = 4 points, Eagle = 5 points, Hole-in-One = 6 points

Our group allows **2 Mulligans per round** of play, which can be used only on the tee box.

## Mulligan vs Provisional Mulligan

I was asked to clarify the difference between the two, so here are two examples:

**Example 1, Mulligan:** You hit your ball from the tee box and it clearly goes out of bounds or wherever. You take a mulligan, and now the mulligan becomes your ball of play.

**Example 2, Provisional Mulligan:** You hit your ball from the tee box and are not sure if it's out of bounds, lost or in play. If you call a Provisional Mulligan, you proceed to hit a second ball from the tee box and it stops in the fairway. Now you locate your 1st ball hit from the tee box. If it is still in play, **YOU MUST** play the 1st ball, retain your provisional mulligan and pick up the second ball lying in the fairway. If the 1st ball is out of bounds or lost, then the provisional mulligan that you hit into the fairway becomes your ball of play. The purpose of the provisional mulligan is not for you to select the best ball but to speed up play, so you don't have to return to the tee box if your 1st ball is out of play or lost.

## Lost Ball Rule

Instead of the player returning to the spot of the previous shot in the event of a lost ball or a ball out of bounds, the player can take a drop in the nearest spot of the fairway (within two club-lengths of the edge of the fairway), no nearer the hole than where the ball crossed the OB line, with a two-stroke penalty.

## Logo Shirts

If you would like to have the group logo on your shirt, please take a shirt of your choosing to the location below and tell them you would like the logo for **Gentlemen Golf Group**. Cost is $12.00 per shirt.

1. Westfield Brandon Mall: Custom Embroidery & T-Shirts, 813-689-6377 (kiosk by Victoria's Secret)

## No Show

If you commit to playing and are unable to play, please notify me or Coach at the numbers above. You are only allowed **2 unexcused NO SHOWS**. Upon the 3rd unexcused NO SHOW you will be removed from the email list and your membership cancelled.

## Most Important

**HAVE FUN!**

**Triple-G Coordinators:** Steve Favors, Chris (Tiger) Jarnegan and Dennis (Coach) Donaldson`};

/* tiny formatting: "# " title, "## " heading, "- " bullet, "1. " numbered, **bold**, blank line = new paragraph */
function letterHTML(src){
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return String(src||'').replace(/\r/g,'').split(/\n\s*\n/).map(blk=>{ const lines=blk.split('\n').map(x=>x.trim()).filter(Boolean); if (!lines.length) return '';
    if (lines.every(l=>/^[-•]\s+/.test(l))) return `<ul>${lines.map(l=>`<li>${inl(l.replace(/^[-•]\s+/,''))}</li>`).join('')}</ul>`;
    if (lines.every(l=>/^\d+[.)]\s+/.test(l))) return `<ol>${lines.map(l=>`<li>${inl(l.replace(/^\d+[.)]\s+/,''))}</li>`).join('')}</ol>`;
    if (lines.length===1 && /^##\s+/.test(lines[0])) return `<h3>${inl(lines[0].replace(/^##\s+/,''))}</h3>`;
    if (lines.length===1 && /^#\s+/.test(lines[0])) return `<h2>${inl(lines[0].replace(/^#\s+/,''))}</h2>`;
    return `<p>${lines.map(inl).join('<br>')}</p>`; }).join('');
}

function backupSeasons(){
  const ys = new Set([new Date().getFullYear()]);

  allRounds().forEach(r=>add(r.date)); SEED.schedule.forEach(r=>add(r.date)); Object.values(S.requests||{}).forEach(r=>add(r.at));

  onStep && onStep('Building the spreadsheet…');

  sheets.push(['Scores', sc]);
  // Rounds
  const sch = SEED.schedule.filter(r=>inY(r.date)), rd=[['Date','Course','Tee time','Tee box','Tee times','Players scored','Scored in','Finalized','Notes']];
  [...new Set([...sch.map(r=>r.date), ...rounds.map(r=>r.date)])].sort().forEach(d=>{ const r=schedFor(d)||{}, a=rounds.find(x=>x.date===d), db=S.dbRounds[d];

  // Hole by hole

  rounds.forEach(r=>{ const pars=courseInfo(r.course).pars, L={...Object.fromEntries(Object.entries(S.dbRounds[r.date]?.cards||{}).map(([k,h])=>[k,{pid:k,holes:h}])), ...(S.live[r.date]||{})};
    Object.values(L).filter(x=>x&&x.holes&&Object.keys(x.holes).length).sort((a,b)=>nm(a.pid).localeCompare(nm(b.pid))).forEach(x=>{ const t=pars?cardTotals(x.holes,pars):{gross:x.gross,toPar:x.toPar,pts:x.pts};
      hb.push([r.date, r.course, nm(x.pid), ...Array.from({length:18},(_,i)=>+x.holes[i+1]||''), t.gross??'', t.toPar??'', t.pts??'']); }); });
  sheets.push(['Hole by hole', hb]);
  // Payouts
  const po=[['Date','Course','Game','Place / hole','Player','Detail','Payout ($)']];
  rounds.forEach(r=>{ const P=payoutData(r.date);

S.gcpay = {}; S.gcSubs = {};
function ensureGcPay(d){
  if (!S.db || !d || S.gcSubs[d]) return; S.gcSubs[d]=true;
  S.db.collection(`gcpay/${d}/marks`).onSnapshot(snap=>{ const m={}; docsOf(snap).forEach(v=>{ if (v&&v.pid&&v.kind) m[v.pid+'_'+v.kind]=v; }); S.gcpay[d]=m; if (route()==='gamecoord') render(); }, ()=>{});
}
const gcPaid = (d, pid, kind) => !!((S.gcpay[d]||{})[pid+'_'+kind]||{}).paid;
function gcRows(d){
  const G=games(), P=S.pairings[d], grp={};
  if (P && P.groups) P.groups.forEach((g,i)=>g.forEach(id=>{ grp[id]=i+1; }));
  return playingIds().filter((id,i,a)=>a.indexOf(id)===i).map(id=>{
    const guest = !!(S.guestsIn||{})[id], q = quotaOn(id, d), sk = inGame(id,'skins'), gm = inGame(id,'ctp');
    return { id, name:sname(id), guest, noQuota: q===null, grp:grp[id]||0,
      skins: sk ? G.skins : 0, game: gm ? (q===null ? G.ctpShare : G.ctp) : 0,
      paidS: gcPaid(d,id,'skins'), paidG: gcPaid(d,id,'game') };

  const days=Math.round((d0-dt)/864e5), tm=t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return days<=0 ? 'Today '+tm : days===1 ? 'Yesterday '+tm : days<7 ? t.toLocaleDateString('en-US',{weekday:'long'})+' '+tm : t.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(t.getFullYear()!==now.getFullYear()?', '+t.getFullYear():'');

async function sideSaveHole(){
  const r=sideRound(sideKey()), k=sideKey(), pars=courseInfo(r.course).pars, L=S.live[k]||{}, hole=S.sHole||1, ids=(myGroup(k)||[]).filter(id=>L[id]);

function shortVal(v){

function logChange(path, beforeP, after){

    if (action==='edit' && !changes.length) return;   // saved with nothing different
    let name = AUDIT.name; try{ if (typeof S!=='undefined' && S.meFull) name = S.meFull; }catch(e){}
    addDoc(collection(fs, 'auditlog'), { at:new Date().toISOString(), uid:AUDIT.uid, email:AUDIT.email, name, action, path, changes:changes.slice(0,30), more:Math.max(0, changes.length-30) }).catch(() => {});
  });
}

/* password emails carry a "Continue" button back to the app (falls back to a plain email if Firebase hasn't approved the address) */
const APP_URL = location.origin + '/';
async function sendReset(a, email){
  try{ return await sendPasswordResetEmail(a, email, { url: APP_URL }); }
  catch(err){ if (/continue-uri|unauthorized-domain|invalid-url|argument-error/.test(err?.code||'')) return sendPasswordResetEmail(a, email); throw err; }
}
const $ = s => document.querySelector(s);
const gate = $('#gate');
function showGate(html){ gate.innerHTML = html; gate.hidden = false; document.body.classList.add('gated'); }
function hideGate(){ gate.hidden = true; gate.innerHTML=''; document.body.classList.remove('gated'); }
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ERR = { 'auth/invalid-credential':'Email or password is not right.', 'auth/wrong-password':'Email or password is not right.', 'auth/user-not-found':'No login for that email yet. Ask a leader to add you.', 'auth/too-many-requests':'Too many tries. Wait a few minutes, or use "Forgot password".', 'auth/invalid-email':'That email doesn’t look right.', 'auth/email-already-in-use':'That email already has a login. Use "Forgot password" to set a new password.', 'auth/weak-password':'Use at least 6 characters.', 'auth/network-request-failed':'No connection. Check your signal and try again.' };
const em = e => ERR[e?.code] || (e?.message || 'Something went wrong.');

function loginForm(msg='', email=''){
  showGate(`<div class="gbox"><img src="3g-logo.jpg" alt="3G Gentlemen's Golf Group crest" class="glogo">
    <h1>Triple-G Golf</h1><p class="muted">Sign in to check in, score and see the leaderboard.</p>
    <form id="gForm" class="form" novalidate>
      <label>Email<input type="email" id="gEmail" autocomplete="username" value="${esc(email)}" required></label>
      <label>Password<input type="password" id="gPass" autocomplete="current-password" required></label>
      <button class="btn big" type="submit">Sign in</button>
    </form>
    <div class="row" style="justify-content:space-between;margin-top:10px"><button class="linkbtn" id="gForgot">Forgot password / first time?</button><button class="linkbtn" id="gSetup">Leader setup</button></div>
    <div class="small" id="gMsg" role="status">${esc(msg)}</div></div>`);
}
gate.addEventListener('submit', async e=>{
  if (e.target.id!=='gForm') return; e.preventDefault();
  const email=$('#gEmail').value.trim(), pass=$('#gPass').value; $('#gMsg').textContent='Signing in…';
  try{ await signInWithEmailAndPassword(auth, email, pass); }catch(err){ $('#gMsg').textContent = em(err); }
});
gate.addEventListener('click', async e=>{
  const t=e.target.closest('button'); if (!t) return;
  if (t.id==='gForgot'){ const email=$('#gEmail')?.value.trim(); if (!email){ $('#gMsg').textContent='Type your email above first, then tap this again.'; return; }
    try{ await sendReset(auth, email); $('#gMsg').textContent=`If ${email} has a Triple-G login, an email to set your password is on its way. Check spam too.`; }catch(err){ $('#gMsg').textContent=em(err); } }
  else if (t.id==='gSetup'){ const email=$('#gEmail').value.trim().toLowerCase(), pass=$('#gPass').value;
    if (!BOOTSTRAP[email]){ $('#gMsg').textContent='Leader setup is only for the group’s organizer. Everyone else: ask a leader to add you, then use "Forgot password / first time?".'; return; }
    try{ const c=await createUserWithEmailAndPassword(auth, email, pass); await sendEmailVerification(c.user); }catch(err){ $('#gMsg').textContent=em(err); } }
  else if (t.id==='gResend'){ try{ await sendEmailVerification(auth.currentUser); $('#gMsg').textContent='Sent again. Check your inbox and spam.'; }catch(err){ $('#gMsg').textContent=em(err); } }
  else if (t.id==='gReload'){ await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); start(auth.currentUser); }
  else if (t.id==='gOut'){ await signOut(auth); }
});

let booted = false;
async function start(user){
  if (!user){ loginForm(); return; }
  const email=(user.email||'').toLowerCase();
  let prof=null;
  try{ const s=await getDoc(doc(fs,'users/'+user.uid)); prof = s.exists() ? s.data() : null; }catch(e){ prof=null; }
  if (!prof && BOOTSTRAP[email]){
    if (!user.emailVerified){
      showGate(`<div class="gbox"><h1>Check your email</h1><p>We sent a link to <b>${esc(email)}</b>. Tap it, then come back and press Continue.</p>
        <div class="row"><button class="btn" id="gReload">Continue</button><button class="btn ghost" id="gResend">Send again</button><button class="linkbtn" id="gOut">Sign out</button></div><div class="small" id="gMsg" role="status"></div></div>`); return;
    }
    prof = { role:'admin', pid:BOOTSTRAP[email], email, name:'Ray Elmore', at:new Date().toISOString() };
    try{ await setDoc(doc(fs,'users/'+user.uid), prof); }catch(e){ showGate(`<div class="gbox"><h1>Setup blocked</h1><p>The database rules haven’t been published yet. Paste firestore.rules into Firebase → Firestore → Rules, publish, then reload.</p><button class="linkbtn" id="gOut">Sign out</button></div>`); return; }
  }
  if (!prof || prof.role==='disabled'){
    showGate(`<div class="gbox"><h1>Not set up yet</h1><p>${esc(email)} is signed in, but it isn’t linked to a Triple-G member. Ask a leader to add you in Admin → Members.</p><button class="btn" id="gOut">Sign out</button></div>`); return;
  }
  hideGate();
  AUDIT = prof.role==='admin' ? { uid:user.uid, email, name:prof.name||'' } : null;
  window.TG_FB = { auth, auth2, fs, doc, setDoc, createUserWithEmailAndPassword, sendPasswordResetEmail: sendReset, signOut, uid:user.uid, email };
  SEEN = { uid:user.uid, pid:prof.pid||'', email, name:prof.name||'' }; markSeen();
  if (!booted){ booted=true; window.bootDB(db, prof, user); } else location.reload();
}
/* ---------- Public leaderboard page (?lb=<key>): no login, reads only public/<key> ---------- */
async function publicView(key){
  document.body.classList.add('pubmode'); hideGate();
  const box = document.createElement('div'); box.id = 'pubview'; box.className = 'app'; document.body.prepend(box);
  box.innerHTML = `<div class="topbar"><img src="3g-icon.png" alt="">Triple-G Leaderboard</div><main><div class="muted">Loading…</div></main>`;
  const m = box.querySelector('main');
  let purify;
  try{ purify = (await import('https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.es.mjs')).default; }
  catch(e){ m.innerHTML = '<div class="card">Couldn’t load the leaderboard. Check your connection and reload.</div>'; return; }
  const clean = h => purify.sanitize(String(h||''), { FORBID_TAGS:['form','input','button','textarea','select','iframe'] });
  const f = (d, o) => new Date(d+'T12:00:00').toLocaleDateString('en-US', o);
  let snap = null, sel = 0;
  const draw = () => {
    if (!snap){ m.innerHTML = '<div class="card">This leaderboard link isn’t active. Ask a Triple-G leader for the current link.</div>'; return; }
    let h = `<div class="small muted">View only · updated ${esc(new Date(snap.at).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</div>`;
    if (snap.live) h += `<div class="pagehead"><h1>Live Leaderboard</h1><span class="livepill">LIVE</span></div>
      <div class="muted">${esc(f(snap.live.date,{weekday:'long',month:'short',day:'numeric'}))} · ${esc(snap.live.course)} · Stableford points against quota</div>${clean(snap.live.html)}`;
    else if (snap.next) h += `<section class="card"><h2>Next round</h2><div>${esc(f(snap.next.date,{weekday:'long',month:'long',day:'numeric'}))} · ${esc(snap.next.course)}</div>
      <div class="small muted" style="margin-top:4px">The live leaderboard shows here once scoring starts.</div></section>`;
    const SR = snap.side || [];
    SR.forEach(r => { h += `<div class="pagehead" style="margin-top:10px"><h1 style="font-size:24px">Side Round${r.live?'':' Results'}</h1>${r.live?'<span class="livepill">LIVE</span>':''}</div>
      <div class="muted">${esc(f(r.date,{weekday:'long',month:'short',day:'numeric'}))}${r.time?' · '+esc(r.time):''} · ${esc(r.course)} · doesn’t count toward Wednesday</div>${clean(r.html)}`; });
    const R = snap.results || [];
    if (R.length){ sel = Math.min(sel, R.length-1);
      h += `<div class="pagehead" style="margin-top:10px"><h1>Results</h1></div>
      <select id="pubSel" aria-label="Choose a round">${R.map((r,i)=>`<option value="${i}"${i===sel?' selected':''}>${esc(f(r.date,{month:'short',day:'numeric',year:'numeric'}))} · ${esc(r.course)}</option>`).join('')}</select>${clean(R[sel].html)}`; }
    m.innerHTML = h;
  };
  box.addEventListener('change', e => { if (e.target.id==='pubSel'){ sel = +e.target.value; draw(); } });
  if (!/^[a-z0-9]{8,40}$/.test(key)){ draw(); return; }
  onSnapshot(doc(fs, 'public/'+key), s => { snap = s.exists() ? s.data() : null; draw(); }, () => { snap = null; draw(); });
}
const PUBKEY = new URLSearchParams(location.search).get('lb');
if (PUBKEY !== null) publicView(PUBKEY);
else onAuthStateChanged(auth, user => { if (booted && !user){ location.reload(); return; } start(user); });
</script>

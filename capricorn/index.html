<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capricorn Bash 2027</title>
<meta name="theme-color" content="#0d0d0d">
<style>
:root{--bg:#0d0d0d;--card:#181715;--card2:#211f1b;--line:#38332a;--ink:#f4efe4;--muted:#b3aa98;--gold:#d8b45a;--gold2:#f0d48a;--good:#7fcf86;--bad:#ef8a80;--r:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--gold2)}
main{max-width:640px;margin:0 auto;padding:16px 14px 24px;display:grid;gap:14px}
h1{font:700 26px Georgia,serif;margin:0;color:var(--gold2)}h2{font:700 19px Georgia,serif;margin:0 0 8px;color:var(--gold2)}h3{margin:12px 0 6px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12px}
.hero{background:linear-gradient(160deg,#1d1a12,#0d0d0d 70%);border:1px solid #4a3f22;border-radius:var(--r);padding:20px 16px;text-align:center}
.hero .k{letter-spacing:.18em;font-size:12px;color:var(--gold)}
.hero .big{font:700 30px Georgia,serif;color:var(--gold2);margin:6px 0 2px}
.cd{display:flex;justify-content:center;gap:10px;margin-top:12px}.cd div{background:#00000060;border:1px solid #4a3f22;border-radius:10px;padding:8px 10px;min-width:64px}.cd b{display:block;font-size:24px;color:var(--gold2)}.cd span{font-size:11px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:#1a1405;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold)}.btn.sm{padding:7px 12px;font-size:14px}.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
input,textarea,select{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:16px}
textarea{min-height:110px}label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.post{border-top:1px solid var(--line);padding:12px 0}.post:first-child{border-top:0;padding-top:0}
.post .meta{font-size:12px;color:var(--muted);margin-bottom:4px}.post .body{white-space:pre-wrap;line-height:1.5}
.pin{color:var(--gold);font-size:12px;font-weight:700}
.cm{background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}.cm b{color:var(--gold2)}
.tl{display:grid;gap:0}.tli{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.tli:first-child{border-top:0}
.tli .d{text-align:center;background:var(--card2);border-radius:10px;padding:6px 0;height:max-content}.tli .d b{display:block;font-size:20px;color:var(--gold2)}.tli .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.tli.past{opacity:.5}.due{color:var(--bad);font-weight:700;font-size:12px}
.grp{background:var(--card2);border-radius:10px;padding:10px;margin-top:8px}.grp .t{font-weight:700;color:var(--gold2);font-size:14px}
.grp.me{outline:2px solid var(--gold)}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;margin:2px}
.chip.gold{border-color:var(--gold);color:var(--gold2)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;background:var(--card2)}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:center}.li:first-child{border-top:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#0d0d0df2;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:5}
nav.tabs a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:11px;padding:4px 0}nav.tabs a b{display:block;font-size:20px;line-height:1.2}nav.tabs a.on{color:var(--gold2)}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.gate .card{max-width:380px;width:100%}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:9;padding:14px}.modal .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.full{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:8px}
.msg{font-size:14px;margin-top:8px}.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.orgbar{background:#2a2412;border:1px solid #4a3f22;border-radius:10px;padding:8px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600;border-top:0}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app"><div class="gate"><div class="card"><h1>Capricorn Bash</h1><p class="muted">Loading…</p></div></div></div>
<div id="modal"></div>
<script type="module">
/* ============ Capricorn Birthday Bash 2027 — one-stop site ============
   Data lives in Firebase (same project as Triple-G), collections prefixed cb_.
   Guests get in with the group passcode; Ray and Kelleye sign in as organizers.
   Add ?demo=1 to the URL to try it with sample data and no sign-in. */
const DEMO = new URLSearchParams(location.search).has('demo');
const OWNERS = ['ray.elmore@powerflightgolf.com','ray.elmore@gmail.com'];
const PP = 121.83;   // buffet & bar per guest

/* ---------- starter content (from the GroupMe, through Nov 6, 2026) ---------- */
const SEED = {
  info: { rows: [
    ['Dates','Thursday, January 14 – Tuesday, January 19, 2027 (MLK weekend)'],
    ['Resort','Mission Resort + Club, 10400 County Road 48, Howey-in-the-Hills, FL 34737'],
    ['Room reservations','Call 800-874-9053 and reference "Capricorn Birthday Bash". $189 deposit; balance due at checkout.'],
    ['Resort fee','$30 per day, added to your nightly stay'],
    ['Black & Gold Sneaker Ball','Saturday, January 16, 6:30–11:45 PM, Legends Ballroom & Terrace. Formal wear with sneakers — no flip flops.'],
    ['Buffet & bar','$121.83 per guest (includes tax and gratuity). Beef, chicken and fish. Cash bar for drinks.'],
    ['Pay buffet & bar','Zelle to Kelleye Elmore. Check that Kelleye Elmore shows as the recipient. Memo: Capricorn Bash – your name.'],
    ['Entertainment','DJ C-Rider'],
    ['Birthday cake','Bari Bakery'],
    ['Birthday honorees','Larry, DD, Ray, Carl and Karen (honorees add $200 toward the DJ and cake)'],
    ['Golfers booked','19 (if a friend wants to golf with us but stay elsewhere, tell Kelleye ASAP)']
  ]},
  dates: [
    {date:'2026-11-13', title:'Please send buffet & bar payment', note:'Kelleye asks for payments by today if possible, so she can pay the resort on the 15th.'},
    {date:'2026-11-15', title:'Buffet & bar payment due — $121.83 per guest', note:'Zelle to Kelleye Elmore (see Event details). No exceptions.', due:true},
    {date:'2026-12-15', title:'Room deposit due — $189', note:'Call Mission Resort at 800-874-9053, reference "Capricorn Birthday Bash". No exceptions.', due:true},
    {date:'2027-01-14', title:'Capricorn Bash begins', note:'5-night guests arrive.'},
    {date:'2027-01-15', time:'12:36 PM', title:'Round 1 — El Campeón', note:'Tee times 12:36–1:08 PM.'},
    {date:'2027-01-16', time:'10:09 AM', title:'Round 2 — Las Colinas', note:'Tee times 10:09–10:41 AM.'},
    {date:'2027-01-16', time:'6:30 PM', title:'Black & Gold Sneaker Ball', note:'Legends Ballroom & Terrace. Cocktail hour 6:30, dinner 7:15, cake 8:30, dancing 9:00. Formal with sneakers.'},
    {date:'2027-01-17', time:'10:12 AM', title:'Round 3 — El Campeón', note:'Tee times 10:12–10:44 AM.'},
    {date:'2027-01-18', time:'10:09 AM', title:'Round 4 — Las Colinas', note:'Tee times 10:09–10:41 AM (5-night guests).'},
    {date:'2027-01-19', title:'Capricorn Bash ends', note:'Safe travels, family!'}
  ],
  golf: [
    {id:'r1', n:1, date:'2027-01-15', course:'El Campeón', first:'12:36', last:'13:08', gap:8, groups:[], show:false},
    {id:'r2', n:2, date:'2027-01-16', course:'Las Colinas', first:'10:09', last:'10:41', gap:8, groups:[], show:false},
    {id:'r3', n:3, date:'2027-01-17', course:'El Campeón', first:'10:12', last:'10:44', gap:8, groups:[], show:false},
    {id:'r4', n:4, date:'2027-01-18', course:'Las Colinas', first:'10:09', last:'10:41', gap:8, groups:[], show:false}
  ],
  people: [],   // real guest list is pasted in by an organizer (Organizer tools → Import), so names aren't in this public file
  posts: [
    {id:'p5', at:'2026-11-06T09:38:00', by:'Kelleye', pinned:true, title:'New tee times', body:'Our tee times are set:\n\n• Fri, Jan 15 — 12:36–1:08 PM, El Campeón\n• Sat, Jan 16 — 10:09–10:41 AM, Las Colinas\n• Sun, Jan 17 — 10:12–10:44 AM, El Campeón\n• Mon, Jan 18 — 10:09–10:41 AM, Las Colinas\n\nIf you have friends who want to golf with us but not stay at Mission, I need to know ASAP. We currently have 19 players booked.'},
    {id:'p4', at:'2026-11-02T20:34:00', by:'Kelleye', title:'Buffet & bar payment tracker', body:'14 of 22 guests have paid ($1,705.62 collected). 8 guests are still outstanding ($974.64). Payments of $121.83 per person are due November 15 — I\'d appreciate them by November 13 if possible, since I pay the resort the full amount on the 15th.'},
    {id:'p3', at:'2026-10-14T19:02:00', by:'Kelleye', title:'Quick update — 30 days to the payment deadline', body:'• Buffet & bar: Banquet Event Order received. Menu coming soon — beef, chicken and fish confirmed.\n• Entertainment: DJ C-Rider is confirmed!\n• Birthday cake: Bari Bakery is confirmed!\n• Legends Ballroom seating layout is in; table assignments later.\n• Room deposit ($189) due no later than December 15.\n\nMain event: Saturday, January 16, 7–11 PM.'},
    {id:'p2', at:'2026-09-02T08:29:00', by:'Kelleye', title:'Final room list submitted', body:'The final by-name room list (12 rooms, 22 guests) was submitted to and accepted by Mission Resort. See the Event tab for who\'s coming.'}
  ]
};

/* ---------- Black & Gold Sneaker Ball (from Kelleye's flyers) ---------- */
const BALL = {
  program: [['6:30 PM','Cocktail hour','Legends B + Terrace'],['7:00 PM','Birthday celebrants entrance','',1],['7:15 PM','Dinner service','American comfort buffet'],
            ['8:00 PM','Celebration & mingling'],['8:30 PM','Cake cutting','',1],['9:00 PM','Music & dancing'],['11:45 PM','Evening concludes']],
  flyers: [['img/evening-program.jpg','Evening program'],['img/dinner-menu.jpg','Dinner menu'],['img/bar-menu.jpg','Bar menu']],
  menu: [['Soup','Cuban black bean with sour cream and green onion'],['Salads','Artisan green salad — vine-ripened tomato, carrot, beet (GF) · Classic spinach salad — purple onion, tomato, egg, candied pecans, warm bacon vinaigrette (GF)'],
         ['Entrées','Buttermilk fried chicken · Grilled sliced skirt steak · Blackened market fish'],['Sides','Seasonal vegetables · Butter-whipped mashed potatoes'],['Dessert',"Chef's selection of desserts"],['Beverages','Deluxe cash bar · Coffee, iced tea and tea selection']],
  bar: [['Signature drink','The Capricorn Old Fashioned — premium bourbon, aromatic bitters, simple syrup, orange peel, Luxardo cherry'],['Also serving','Premium spirits, wine, imported and domestic beers, assorted cocktails'],['Non-alcoholic','Iced tea, lemonade, soft drinks, bottled water']]
};

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const D = s => new Date(s.length===10 ? s+'T12:00:00' : s);
const fmt = (s,o) => D(s).toLocaleDateString('en-US',o);
const today = () => new Date().toISOString().slice(0,10);
const t12 = hm => { if (!hm) return ''; let [h,m]=hm.split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };
const addMin = (hm,n) => { let [h,m]=hm.split(':').map(Number); m+=n; h+=Math.floor(m/60); m%=60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; };
const ago = s => { const m=Math.round((Date.now()-D(s))/60000); if (m<1) return 'just now'; if (m<60) return m+' min ago'; const h=Math.round(m/60); if (h<24) return h+' hr ago'; const d=Math.round(h/24); return d<7 ? d+' day'+(d>1?'s':'')+' ago' : fmt(s,{month:'short',day:'numeric'}); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- data layer: Firebase or in-memory demo ---------- */
// Firestore can't store a list inside a list, so event-detail rows and pairing groups are saved as objects.
const pack = (col, data) => {
  if (col==='cb_meta' && Array.isArray(data.rows)) return {...data, rows: data.rows.map(r=>Array.isArray(r)?{k:r[0], v:r[1]}:r)};
  if (col==='cb_golf' && Array.isArray(data.groups)) return {...data, groups: data.groups.map(g=>Array.isArray(g)?{p:g}:g)};
  return data;
};
const unpack = (col, data) => {
  if (col==='cb_meta' && Array.isArray(data.rows)) return {...data, rows: data.rows.map(r=>Array.isArray(r)?r:[r.k, r.v])};
  if (col==='cb_golf' && Array.isArray(data.groups)) return {...data, groups: data.groups.map(g=>Array.isArray(g)?g:(g.p||[]))};
  return data;
};
const S = { posts:[], comments:[], dates:[], golf:[], people:[], pay:{}, info:null, paysum:null, config:null, photos:[], me:null, route:'home', open:{}, scores:[], ctp:[], hcp:{}, courses:{}, games:null };
let DB;
async function initDemo(){
  const mem = {}; const subs = {};
  const fire = col => (subs[col]||[]).forEach(cb=>cb(Object.values(mem[col]||{}).map(x=>unpack(col,x))));
  DB = {
    sub:(col,cb)=>{ (subs[col]=subs[col]||[]).push(cb); setTimeout(()=>cb(Object.values(mem[col]||{}).map(x=>unpack(col,x))),0); },
    get:async(col,id)=> (mem[col]||{})[id] ? unpack(col,(mem[col])[id]) : null,
    set:async(col,id,data)=>{ const d=pack(col,data); if (JSON.stringify(d).match(/\[\s*\[/)) throw Object.assign(new Error('nested list'),{code:'invalid-argument'}); (mem[col]=mem[col]||{})[id]={...d,id}; fire(col); },
    del:async(col,id)=>{ delete (mem[col]||{})[id]; fire(col); }
  };
  S.me = {uid:'demo', name:'Demo Organizer', org:true, owner:true};
  await seedAll();
  const nm=['A','B','C','D','E','F','G','H','J','K','L','M']; for (const [i,x] of nm.entries()) await DB.set('cb_people','s'+i,{party:`Sample Party ${x}`, golfers: i%4===3?[`Golfer ${x}1`]:[`Golfer ${x}1`,`Golfer ${x}2`], others: i%4===3?[`Guest ${x}2`]:[], room: i%3?'DBL':'SGL', nights: i<2?5:3});
  start();
}
async function initFirebase(){
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const F = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const app = initializeApp({ apiKey:"AIzaSyApcbnU40cR2YrDNGpZrhxqFmDkN4bfh2g", authDomain:"triple-g-de71a.firebaseapp.com", projectId:"triple-g-de71a",
    storageBucket:"triple-g-de71a.firebasestorage.app", messagingSenderId:"647959305551", appId:"1:647959305551:web:c8de2ccca94cd7f745b93a" }, 'capricorn');
  const fs = F.initializeFirestore(app, { ignoreUndefinedProperties:true }), auth = A.getAuth(app);
  DB = {
    sub:(col,cb)=>F.onSnapshot(F.collection(fs,col), s=>cb(s.docs.map(d=>unpack(col,{...d.data(), id:d.id}))), e=>{ console.warn(col,e.code); cb([]); }),
    get:async(col,id)=>{ const d=await F.getDoc(F.doc(fs,col,id)); return d.exists()?unpack(col,{...d.data(),id:d.id}):null; },
    set:(col,id,data)=>F.setDoc(F.doc(fs,col,id), pack(col,data)),
    del:(col,id)=>F.deleteDoc(F.doc(fs,col,id))
  };
  DB.auth = { auth, A };
  A.onAuthStateChanged(auth, async user=>{
    if (!user){ gate(); return; }
    try{
      if (user.isAnonymous){
        if (S.joining) return;   // passcode entry in progress; the Enter button finishes sign-in
        S.loadStep='checking your guest pass'; const m = await DB.get('cb_members', user.uid);
        if (!m){ gate(); return; }
        S.me = {uid:user.uid, name:m.name, org:false};
      } else {
        const email=(user.email||'').toLowerCase(); let cfg=null;
        S.loadStep='reading the organizer list'; try{ cfg = await DB.get('cb_meta','config'); }catch(e){}
        const owner = OWNERS.includes(email), org = owner || (cfg?.orgs||[]).includes(email);
        if (!org){ gate(`${esc(user.email)} isn't on the organizer list. Ask Ray to add you, or use the group passcode instead.`); await A.signOut(auth); return; }
        S.me = {uid:user.uid, name: owner?'Ray':(cfg?.names?.[email]||user.email.split('@')[0]), email, org:true, owner};
      }
      if (S.me.org){ const c = await DB.get('cb_meta','config').catch(()=>null); S.loadStep='loading the starter info'; if (!c?.seeded) await seedAll();
        else if (S.me.owner && (c.v||1) < 2){ S.loadStep='updating the Ball times';   // one-time: Ball now 6:30–11:45 PM per Kelleye's program
          const inf = await DB.get('cb_meta','info'); const r = inf?.rows?.find(x=>x[0]==='Black & Gold Sneaker Ball');
          if (r && r[1]==='Saturday, January 16, 7–11 PM, Legends Ballroom. Formal wear with sneakers — no flip flops.'){ r[1]='Saturday, January 16, 6:30–11:45 PM, Legends Ballroom & Terrace. Formal wear with sneakers — no flip flops.'; await DB.set('cb_meta','info',{rows:inf.rows}); }
          const nd = SEED.dates.find(d=>d.title==='Black & Gold Sneaker Ball');
          for (let i=0;i<SEED.dates.length;i++){ const d=await DB.get('cb_dates','d'+i); if (d && d.title==='Black & Gold Sneaker Ball' && d.time==='7:00 PM') await DB.set('cb_dates','d'+i,{...nd}); }
          await DB.set('cb_meta','config',{...c, v:2}); } }

      start();
    }catch(e){ console.error(e);
      const why = e?.code==='permission-denied' || /permission/i.test(e?.message||'')
        ? `The database said "no" (${S.loadStep||'loading'}). The Capricorn rules may not be published yet, or were pasted in the wrong place — see Step 2 of the setup steps.`
        : `Couldn't load the site (${esc(e?.code||e?.message||'unknown error')} while ${S.loadStep||'loading'}). Check your connection and try again.`;
      gate(why); }
  });
}
async function seedAll(){
  for (const p of SEED.posts) await DB.set('cb_posts', p.id, p);
  for (const [i,d] of SEED.dates.entries()) await DB.set('cb_dates', 'd'+i, d);
  for (const g of SEED.golf) await DB.set('cb_golf', g.id, g);
  for (const p of SEED.people) await DB.set('cb_people', p.id, p);
  await DB.set('cb_meta','info', SEED.info);
  const prev = await DB.get('cb_meta','config').catch(()=>null);
  await DB.set('cb_meta','config', {...(prev||{orgs:[], names:{}}), seeded:true});
}
let started=false;
function start(){
  if (started){ render(); return; } started=true;
  DB.sub('cb_posts', v=>{ S.posts=v; render(); });
  DB.sub('cb_comments', v=>{ S.comments=v; render(); });
  DB.sub('cb_dates', v=>{ S.dates=v; render(); });
  DB.sub('cb_golf', v=>{ S.golf=v; render(); });
  DB.sub('cb_people', v=>{ S.people=v; render(); });
  DB.sub('cb_photos', v=>{ S.photos=v; render(); });
  DB.sub('cb_scores', v=>{ S.scores=v; render(); });
  DB.sub('cb_ctp', v=>{ S.ctp=v; render(); });
  DB.sub('cb_hcp', v=>{ S.hcp=Object.fromEntries(v.map(x=>[x.id,x])); render(); });
  DB.sub('cb_courses', v=>{ S.courses=Object.fromEntries(v.map(x=>[x.id,x])); render(); });
  DB.sub('cb_meta', v=>{ S.info=v.find(x=>x.id==='info'); S.paysum=v.find(x=>x.id==='paysum'); S.config=v.find(x=>x.id==='config'); S.games=v.find(x=>x.id==='games')||null; render(); });
  if (S.me.org) DB.sub('cb_pay', v=>{ S.pay=Object.fromEntries(v.map(x=>[x.id,x])); render(); });
  addEventListener('hashchange', render);
  render();
}

/* ---------- gate: passcode for guests, sign-in for organizers ---------- */
function gate(note){
  S.me=null;
  $('#app').innerHTML = `<div class="gate"><div class="card">
    <div class="tiny muted" style="letter-spacing:.18em">BLACK &amp; GOLD</div><h1>Capricorn Bash 2027</h1>
    <p class="muted small">January 14–19, 2027 · Mission Resort + Club</p>
    ${note?`<div class="msg err">${note}</div>`:''}
    <label class="f" for="gName">Your name</label><input id="gName" autocomplete="name" placeholder="First and last name">
    <label class="f" for="gCode">Group passcode</label><input id="gCode" autocomplete="off" autocapitalize="off" placeholder="From Kelleye or Ray">
    <button class="btn" id="gGo" style="width:100%;margin-top:14px">Enter</button>
    <div class="msg" id="gMsg" role="status"></div>
    <details style="margin-top:16px"><summary class="small muted">Organizer sign-in</summary>
      <label class="f" for="oEmail">Email</label><input id="oEmail" type="email" autocomplete="email">

/* =================== GOLF: scoring, live leaderboard, games =================== */
// Strokes: half the handicap, rounded up, never more than 9 (e.g. 7 → 4, 12 → 6, 20 → 9).
// Net skins and net leaderboard use strokes on the hardest holes (by stroke index). Birdie pot = true (gross) birdies.
const COURSES = {
  'el-campeon':  { name:'El Campeón',  pars:[5,3,4,4,4,4,4,3,4, 5,4,3,4,5,3,4,5,4], si:[3,13,11,1,9,7,5,15,17, 16,6,14,10,2,18,12,4,8], verified:true },
  'las-colinas': { name:'Las Colinas', pars:[4,3,4,4,5,3,4,4,4, 4,3,4,5,4,3,4,4,5], si:[14,16,2,6,10,18,12,4,8, 13,15,3,7,1,11,17,9,5], verified:false }
};
const gkey = n => String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const cid = name => gkey(String(name||'').normalize('NFD').replace(/[̀-ͯ]/g,''));
const course = r => { const id=cid(r?.course), base=COURSES[id]||{name:r?.course||'', pars:Array(18).fill(4), si:Array.from({length:18},(_,i)=>i+1)}; const o=S.courses?.[id]; return {...base, ...(o||{}), id}; };
const hcpOf = n => { const v=S.hcp?.[gkey(n)]?.hcp; return v===undefined||v===null||v==='' ? null : +v; };
const strokesOf = n => { const h=hcpOf(n); return h===null ? 0 : Math.min(9, Math.ceil(Math.max(0,h)/2)); };
const strokeOn = (n, hole, c) => strokesOf(n) >= c.si[hole-1] ? 1 : 0;   // max 9 strokes, so at most 1 per hole
const scoreDoc = (rid, n) => S.scores.find(s=>s.round===rid && s.name===n);
const G = () => ({ skins:0, ctp:0, birdie:0, out:{}, ...(S.games||{}) });
const inGame = (n, g) => !((G().out?.[g])||[]).includes(n);
const golfersIn = r => allGolfers().filter(g=>playsRound(g,r)).map(g=>g.name);
const toParStr = v => v===0 ? 'E' : (v>0?'+':'')+v;
const ctpFt = e => e ? `${e.ft}' ${e.inch||0}"` : '';

function lineFor(r, n){
  const c=course(r), H=scoreDoc(r.id,n)?.holes||{}; let gross=0, net=0, par=0, thru=0, f9=0, b9=0;
  for (let h=1; h<=18; h++){ const g=+H[h]; if (!(g>0)) continue; thru++; gross+=g; par+=c.pars[h-1]; net+=g-strokeOn(n,h,c); if (h<=9) f9+=g; else b9+=g; }
  return { n, H, thru, gross, net, par, grossTP: gross-par, netTP: net-par, f9, b9, strokes: strokesOf(n), hcp: hcpOf(n) };
}
function boardRows(r){ const names=new Set([...golfersIn(r), ...S.scores.filter(s=>s.round===r.id).map(s=>s.name)]);
  const rows=[...names].map(n=>lineFor(r,n)).sort((a,b)=>(a.thru?a.netTP:999)-(b.thru?b.netTP:999) || b.thru-a.thru || a.grossTP-b.grossTP);
  let rank=0, prev=null; rows.forEach((x,i)=>{ const k=x.thru?x.netTP:null; if (k!==prev){ rank=i+1; prev=k; } x.rank=k===null?'':rank; }); return rows; }
function skinsFor(r){ const c=course(r), names=golfersIn(r).filter(n=>inGame(n,'skins')), wins=[];
  for (let h=1; h<=18; h++){ const sc=names.map(n=>({n, g:+(scoreDoc(r.id,n)?.holes||{})[h]})).filter(x=>x.g>0).map(x=>({...x, net:x.g-strokeOn(x.n,h,c)}));
    if (!sc.length) continue; const lo=Math.min(...sc.map(x=>x.net)), w=sc.filter(x=>x.net===lo); if (w.length===1) wins.push({h, n:w[0].n, net:lo, g:w[0].g}); }
  const pot=G().skins*names.length, each=wins.length?pot/wins.length:0; return {pot, players:names.length, wins, each}; }
function birdiesFor(r){ const c=course(r), names=golfersIn(r).filter(n=>inGame(n,'birdie')), list=[];
  names.forEach(n=>{ const H=scoreDoc(r.id,n)?.holes||{}; for (let h=1; h<=18; h++){ const g=+H[h]; if (g>0 && g<=c.pars[h-1]-1) list.push({n,h,g,label: g<=c.pars[h-1]-2?'Eagle':'Birdie'}); } });
  const pot=G().birdie*names.length, each=list.length?pot/list.length:0; return {pot, players:names.length, list, each}; }
function ctpFor(r){ const c=course(r), names=golfersIn(r).filter(n=>inGame(n,'ctp')), p3=c.pars.map((p,i)=>p===3?i+1:0).filter(Boolean);
  const holes=p3.map(h=>({h, e:S.ctp.find(x=>x.round===r.id && x.hole===h)})); const won=holes.filter(x=>x.e).length;
  const pot=G().ctp*names.length, each=p3.length?pot/p3.length:0; return {pot, players:names.length, holes, each, won}; }

async function setHole(rid, n, hole, v){ const d=scoreDoc(rid,n)||{round:rid, name:n, holes:{}}; const holes={...(d.holes||{})}; if (v>0) holes[hole]=v; else delete holes[hole];
  const id=rid+'__'+gkey(n), rec={round:rid, name:n, holes, v9:!!d.v9, v18:!!d.v18, by:S.me.name, at:new Date().toISOString()};
  const i=S.scores.findIndex(s=>s.id===id); if (i>=0) S.scores[i]={...rec,id}; else S.scores.push({...rec,id}); render(); await DB.set('cb_scores', id, rec); }
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-sgrp],[data-sgo],#sCancel,#sChange,[data-shole],[data-sinc],[data-sdec],[data-sver],[data-sctp],[data-csave]'); if (!b || !S.me) return; const ds=b.dataset;
  try{
    if (ds.sgrp){ const [rid,i]=ds.sgrp.split('|'), r=S.golf.find(x=>x.id===rid); setMyGroup(rid, (r.groups[+i]||[]).slice(0,4)); S.pickOpen=false; S.pick=null; render(); }
    else if (ds.sgo){ setMyGroup(ds.sgo, [...(S.pick||myGroupFor(ds.sgo)||[])].slice(0,4)); S.pickOpen=false; S.pick=null; render(); }
    else if (b.id==='sCancel'){ S.pickOpen=false; S.pick=null; render(); }
    else if (b.id==='sChange'){ S.pickOpen=true; S.pick=null; render(); }
    else if (ds.shole){ const [rid,h]=ds.shole.split('|'); S['cbhole-'+rid]=+h; try{ sessionStorage.setItem('cbhole-'+rid, h); }catch(err){} render(); scrollTo(0,0); }
    else if (ds.sinc||ds.sdec){ const [rid,h,n]=(ds.sinc||ds.sdec).split('|'), r=S.golf.find(x=>x.id===rid), par=course(r).pars[+h-1], cur=+(scoreDoc(rid,n)?.holes||{})[h]||0;
      const v = ds.sinc ? (cur? Math.min(15,cur+1) : par) : (cur? Math.max(0,cur-1) : 0); if (v!==cur) await setHole(rid, n, +h, v); }
    else if (ds.sver){ const [rid,k]=ds.sver.split('|'); for (const n of myGroupFor(rid)||[]){ const d=scoreDoc(rid,n); if (d) await DB.set('cb_scores', d.id, {round:d.round, name:d.name, holes:d.holes, v9:k==='v9'||!!d.v9, v18:k==='v18'||!!d.v18, by:S.me.name, at:new Date().toISOString()}); } }
    else if (ds.sctp){ const [rid,h]=ds.sctp.split('|'), n=$('#ctpN')?.value, ft=+$('#ctpF').value, inch=+($('#ctpI').value||0), m=$('#ctpMsg');
      if (!n || !(ft>=0) || $('#ctpF').value==='' || inch<0 || inch>11){ m.className='msg err'; m.textContent='Pick the player and enter feet (and inches 0–11).'; return; }
      const cur=S.ctp.find(x=>x.round===rid && x.hole===+h), d=ft*12+inch;
      if (cur && cur.ft*12+(cur.inch||0) <= d){ m.className='msg err'; m.textContent=`${cur.name} is closer (${ctpFt(cur)}). Not saved.`; return; }
      await DB.set('cb_ctp', rid+'__'+h, {round:rid, hole:+h, name:n, ft, inch, by:S.me.name, at:new Date().toISOString()}); m.className='msg ok'; m.textContent=`${n} is the new leader on #${h}.`; }
    else if (ds.csave){ const id=ds.csave, nums=s=>s.split(/[ ,]+/).map(Number).filter(x=>x>0), pars=nums($('#cp_'+id).value), si=nums($('#cs_'+id).value), m=$('#cm_'+id);
      if (pars.length!==18 || si.length!==18 || new Set(si).size!==18){ m.className='msg err'; m.textContent='Need 18 pars and 18 different stroke-index numbers (1–18).'; return; }
      await DB.set('cb_courses', id, {pars, si, verified:true}); m.className='msg ok'; m.textContent='Card saved.'; }
  }catch(err){ console.error(err); alertMsg('That didn\'t save. Check your connection and try again.'); }
});
document.addEventListener('change', async e=>{ const t=e.target, ds=t.dataset||{}; if (!S.me) return;
  try{
    if (ds.spk){ const s=new Set(S.pick||myGroupFor(location.hash.split('/')[1]||curRound()?.id)||[]); if (t.checked){ if (s.size>=4){ t.checked=false; return; } s.add(ds.spk); } else s.delete(ds.spk); S.pick=[...s]; render(); }
    else if (ds.hcp){ const v=t.value.trim(); await DB.set('cb_hcp', gkey(ds.hcp), {name:ds.hcp, hcp: v===''?null:+v, at:new Date().toISOString()}); }
    else if (ds.gamt){ await DB.set('cb_meta','games',{...G(), [ds.gamt]: +t.value||0}); }
    else if (ds.gin){ const [k,n]=ds.gin.split('|'), g=G(), out=new Set(g.out?.[k]||[]); t.checked?out.delete(n):out.add(n); await DB.set('cb_meta','games',{...g, out:{...(g.out||{}), [k]:[...out]}}); }
  }catch(err){ console.error(err); alertMsg('That didn\'t save. Check your connection and try again.'); }
});
function alertMsg(t){ modal(`<div>${esc(t)}</div><div class="row" style="margin-top:12px"><button class="btn ghost sm" data-close>OK</button></div>`); }

/* ---------- render ---------- */
function render(){
  if (!S.me) return;
  const [r,arg] = (location.hash.slice(1)||'home').split('/'); S.route = V[r] ? r : 'home';
  const focus=document.activeElement, fid=focus?.id, val=focus?.value, sel=[focus?.selectionStart,focus?.selectionEnd];
  const keep={}; document.querySelectorAll('input[id^="c_"],#pcNew,#orgEmail,#orgName').forEach(i=>keep[i.id]=i.value);
  const tab = (h,ic,l) => `<a href="#${h}" class="${S.route===h||(h==='golf'&&['pair','score','board','golfadmin'].includes(S.route))||(h==='updates'&&S.route==='dates')?'on':''}"><b>${ic}</b>${l}</a>`;
  $('#app').innerHTML = V[S.route](arg) + `<nav class="tabs">${tab('home','⌂','Home')}${tab('updates','📣','Updates')}${tab('golf','⛳','Golf')}${tab('event','🎉','Event')}${tab('photos','📷','Photos')}</nav>`;
  Object.entries(keep).forEach(([k,v])=>{ const el=document.getElementById(k); if (el) el.value=v; });
  if (fid){ const el=document.getElementById(fid); if (el){ el.focus(); try{ el.setSelectionRange(...sel); }catch(e){} } }
}
setInterval(()=>{ if (S.route==='home' && !document.activeElement?.matches('input,textarea')) render(); }, 60000);

/* ---------- modal forms ---------- */
function modal(html){ $('#modal').innerHTML = html ? `<div class="modal" role="dialog" aria-modal="true"><div class="card">${html}</div></div>` : ''; }
document.addEventListener('click', e=>{ if (e.target.classList?.contains('modal')) modal(''); if (e.target.closest('[data-close]')) modal(''); });
function postForm(p){
  modal(`<h2>${p?'Edit update':'New update'}</h2>
  <label class="f" for="fTitle">Title</label><input id="fTitle" value="${esc(p?.title||'')}" maxlength="120">
  <label class="f" for="fBody">Message</label><textarea id="fBody" maxlength="4000">${esc(p?.body||'')}</textarea>
  <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="fPin" style="width:auto" ${p?.pinned?'checked':''}> Pin to the top</label>
  <div class="row" style="margin-top:14px"><button class="btn" data-psv="${p?.id||''}">${p?'Save':'Post update'}</button><button class="btn ghost" data-close>Cancel</button>${p?`<button class="btn danger" data-pdel="${p.id}">Delete</button>`:''}</div><div class="msg" id="fMsg"></div>`);
}
function dateForm(d){
  modal(`<h2>${d?'Edit date':'Add date'}</h2>
  <label class="f" for="fDate">Date</label><input id="fDate" type="date" value="${esc(d?.date||'')}">
  <label class="f" for="fTime">Time (optional)</label><input id="fTime" value="${esc(d?.time||'')}" placeholder="7:00 PM">
  <label class="f" for="fDT">What's happening</label><input id="fDT" value="${esc(d?.title||'')}" maxlength="120">
  <label class="f" for="fNote">Details (optional)</label><textarea id="fNote" style="min-height:70px">${esc(d?.note||'')}</textarea>
  <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="fDue" style="width:auto" ${d?.due?'checked':''}> Mark as a deadline</label>
  <div class="row" style="margin-top:14px"><button class="btn" data-dsv="${d?.id||''}">Save</button><button class="btn ghost" data-close>Cancel</button>${d?`<button class="btn danger" data-ddel="${d.id}">Delete</button>`:''}</div><div class="msg" id="fMsg"></div>`);
}
function partyForm(p){
  modal(`<h2>${p?'Edit party':'Add party'}</h2>
  <label class="f" for="fParty">Party name</label><input id="fParty" value="${esc(p?.party||'')}" placeholder="John & Nicole Willis">
  <label class="f" for="fG">Golfers (one per line)</label><textarea id="fG" style="min-height:70px">${esc((p?.golfers||[]).join('\n'))}</textarea>
  <label class="f" for="fO">Non-golfers (one per line)</label><textarea id="fO" style="min-height:50px">${esc((p?.others||[]).join('\n'))}</textarea>
  <div class="row"><div style="flex:1"><label class="f" for="fRoom">Room</label><select id="fRoom"><option ${p?.room!=='SGL'?'selected':''}>DBL</option><option ${p?.room==='SGL'?'selected':''}>SGL</option></select></div>
  <div style="flex:1"><label class="f" for="fN">Nights</label><select id="fN">${[3,4,5].map(n=>`<option ${+(p?.nights||3)===n?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <div class="tiny muted" style="margin-top:6px">5-night golfers are paired for all 4 rounds; others for rounds 1–3.</div>
  <div class="row" style="margin-top:14px"><button class="btn" data-pesv="${p?.id||''}">Save</button><button class="btn ghost" data-close>Cancel</button>${p?`<button class="btn danger" data-pedel="${p.id}">Remove</button>`:''}</div><div class="msg" id="fMsg"></div>`);
}
function infoForm(){
  const rows=(S.info?.rows)||SEED.info.rows;
  modal(`<h2>Edit event details</h2><div class="small muted">One item per line: <b>Label: details</b></div>
  <textarea id="fInfo" style="min-height:300px">${esc(rows.map(([k,v])=>`${k}: ${v}`).join('\n'))}</textarea>
  <div class="row" style="margin-top:14px"><button class="btn" id="iSave">Save</button><button class="btn ghost" data-close>Cancel</button></div><div class="msg" id="fMsg"></div>`);
}
async function writePaySum(){
  const t=S.people.reduce((a,p)=>a+guestsOf(p),0), paid=S.people.reduce((a,p)=>a+(S.pay[p.id]?.guests||0),0);
  await DB.set('cb_meta','paysum',{guests:t, paid, at:new Date().toISOString()});
}

/* ---------- photo upload: shrink on the phone, store in the database ---------- */
function shrink(file, max, q){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Not an image')); }; img.src=url; }); }
document.addEventListener('change', async e=>{
  const t=e.target;
  if (t.id==='phFile'){
    const files=[...t.files], m=$('#phMsg'); let ok=0;
    for (const [i,f] of files.entries()){
      m.className='msg'; m.textContent=`Uploading ${i+1} of ${files.length}…`;
      try{
        let full=await shrink(f,1600,.8); if (full.length>850000) full=await shrink(f,1200,.7);
        const thumb=await shrink(f,360,.7), id=uid();
        await DB.set('cb_photofull', id, {data:full, uid:S.me.uid});
        await DB.set('cb_photos', id, {thumb, uid:S.me.uid, name:S.me.name, caption:'', at:new Date().toISOString()});
        ok++;
      }catch(err){ console.warn(err); }
    }
    m.className = ok===files.length?'msg ok':'msg err'; m.textContent = ok===files.length ? `${ok} photo${ok>1?'s':''} added.` : `${ok} of ${files.length} uploaded. Try the rest again.`;
    t.value='';
  }
  else if (t.dataset.pay){ await DB.set('cb_pay', t.dataset.pay, {guests:+t.value, at:new Date().toISOString(), by:S.me.name}); S.pay[t.dataset.pay]={guests:+t.value}; await writePaySum(); }
  else if (t.dataset.mv){ const [i,n]=t.dataset.mv.split('|'), E=S.edit; E.groups[+i]=E.groups[+i].filter(x=>x!==n); if (t.value!=='x') E.groups[+t.value].push(n); E.groups=E.groups.filter(g=>g.length); render(); }
  else if (t.dataset.add){ const n=t.dataset.add, E=S.edit; if (t.value==='new') E.groups.push([n]); else if (t.value==='out') E.out.push(n); else if (t.value!=='') E.groups[+t.value].push(n); render(); }
});

/* ---------- actions ---------- */
document.addEventListener('click', async e=>{
  const b=e.target.closest('button,a[data-cdel],a[data-dedit],a[data-peedit],a[data-unout],a[data-orgdel],img[data-ph],img[data-flyer]'); if (!b || !S.me) return;
  const ds=b.dataset, fm=()=>$('#fMsg');
  try{
    if (ds.cmt!==undefined && ds.cmt){ S.open[ds.cmt]=!S.open[ds.cmt]; render(); }
    else if (ds.csend){ const i=$('#c_'+ds.csend), txt=i.value.trim(); if (!txt) return; b.disabled=true; await DB.set('cb_comments', uid(), {post:ds.csend, text:txt.slice(0,500), name:S.me.name, uid:S.me.uid, at:new Date().toISOString()}); i.value=''; }
    else if (ds.cdel){ e.preventDefault(); if (confirmDel('this comment')) await DB.del('cb_comments', ds.cdel); }
    else if (b.id==='pNew') postForm();
    else if (ds.pedit) postForm(S.posts.find(p=>p.id===ds.pedit));
    else if (ds.psv!==undefined){ const title=$('#fTitle').value.trim(), body=$('#fBody').value.trim(); if (!body){ fm().className='msg err'; fm().textContent='Write a message first.'; return; }
      const old=S.posts.find(p=>p.id===ds.psv); await DB.set('cb_posts', ds.psv||uid(), {title, body, pinned:$('#fPin').checked, by: old?.by || S.me.name, at: old?.at || new Date().toISOString(), edited: old?new Date().toISOString():null}); modal(''); }
    else if (ds.pdel){ if (confirmDel('this update')){ await DB.del('cb_posts', ds.pdel); modal(''); } }
    else if (b.id==='dNew') dateForm();
    else if (ds.dedit){ e.preventDefault(); dateForm(S.dates.find(d=>d.id===ds.dedit)); }
    else if (ds.dsv!==undefined){ const date=$('#fDate').value, title=$('#fDT').value.trim(); if (!date||!title){ fm().className='msg err'; fm().textContent='Add a date and what\'s happening.'; return; }
      await DB.set('cb_dates', ds.dsv||uid(), {date, time:$('#fTime').value.trim(), title, note:$('#fNote').value.trim(), due:$('#fDue').checked}); modal(''); }
    else if (ds.ddel){ if (confirmDel('this date')){ await DB.del('cb_dates', ds.ddel); modal(''); } }
    else if (b.id==='peNew') partyForm();
    else if (ds.peedit){ e.preventDefault(); partyForm(S.people.find(p=>p.id===ds.peedit)); }
    else if (ds.pesv!==undefined){ const party=$('#fParty').value.trim(), lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean); if (!party){ fm().className='msg err'; fm().textContent='Give the party a name.'; return; }
      await DB.set('cb_people', ds.pesv||uid(), {party, golfers:lines($('#fG').value), others:lines($('#fO').value), room:$('#fRoom').value, nights:+$('#fN').value}); modal(''); await writePaySum(); }
    else if (ds.pedel){ if (confirmDel('this party')){ await DB.del('cb_people', ds.pedel); modal(''); await writePaySum(); } }
    else if (b.id==='iEdit') infoForm();
    else if (b.id==='iSave'){ const rows=$('#fInfo').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const i=l.indexOf(':'); return i>0?[l.slice(0,i).trim(), l.slice(i+1).trim()]:['',l]; }); await DB.set('cb_meta','info',{rows}); modal(''); }
    else if (ds.gen){ const r=S.golf.find(x=>x.id===S.edit.id), E=S.edit;
      const names=allGolfers().filter(g=>!E.out.includes(g.name) && ((g.party.nights||3)>=5 || r.n<=3));
      let units = ds.gen==='party' ? Object.values(names.reduce((m,g)=>((m[g.party.id]=m[g.party.id]||[]).push(g.name),m),{})) : names.map(g=>[g.name]);
      units = units.map(u=>[Math.random(),u]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
      const n=names.length, ng=Math.max(1,Math.ceil(n/4)), groups=Array.from({length:ng},()=>[]);
      const sizes=Array.from({length:ng},(_,i)=> i < n - 3*ng ? 4 : 3);
      units.sort((a,b)=>b.length-a.length).forEach(u=>{ let gi=groups.findIndex((g,i)=>g.length+u.length<=sizes[i]); if (gi<0) gi=groups.reduce((bi,g,i)=>g.length<groups[bi].length?i:bi,0); groups[gi].push(...u); });
      E.groups=groups.map(g=>g.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])).sort(()=>Math.random()-.5); render(); }
    else if (ds.unout){ e.preventDefault(); S.edit.out=S.edit.out.filter(x=>x!==ds.unout); render(); }
    else if (ds.psave){ const r=S.golf.find(x=>x.id===S.edit.id); await DB.set('cb_golf', r.id, {...r, groups:S.edit.groups.map(g=>[...g]), out:[...S.edit.out], show: ds.psave==='pub' ? true : !!r.show}); const m=$('#pMsg'); m.className='msg ok'; m.textContent= ds.psave==='pub'?'Published — everyone can see these pairings on the Golf tab.':'Draft saved.'; }
    else if (ds.flyer){ modal(`<img class="full" src="${ds.flyer}" alt="Flyer" style="max-height:80vh"><div class="row" style="justify-content:flex-end;margin-top:8px"><a class="btn ghost sm" href="${ds.flyer}" download>Save</a><button class="btn ghost sm" data-close>Close</button></div>`); }
    else if (ds.ph){ const ph=S.photos.find(x=>x.id===ds.ph); modal(`<img class="full" src="${ph.thumb}" id="phBig" alt=""><div class="row between" style="margin-top:8px"><span class="small muted">${esc(ph.name)} · ${ago(ph.at)}</span><span class="row">${(ph.uid===S.me.uid||ORG())?`<button class="btn danger sm" data-phdel="${ph.id}">Delete</button>`:''}<button class="btn ghost sm" data-close>Close</button></span></div>`);
      const full=await DB.get('cb_photofull', ph.id).catch(()=>null); if (full && $('#phBig')) $('#phBig').src=full.data; }
    else if (ds.phdel){ if (confirmDel('this photo')){ await DB.del('cb_photos', ds.phdel); await DB.del('cb_photofull', ds.phdel).catch(()=>{}); modal(''); } }
    else if (b.id==='pcSave'){ const v=$('#pcNew').value.trim(), m=$('#pcMsg'); if (v.length<4){ m.className='msg err'; m.textContent='Use at least 4 characters.'; return; } await DB.set('cb_secret','access',{code:v, at:new Date().toISOString()}); m.className='msg ok'; m.textContent=`Passcode set to "${v}". Share it with the group.`; $('#pcNew').value=''; }
    else if (b.id==='orgAdd'){ const em=$('#orgEmail').value.trim().toLowerCase(), nm=$('#orgName').value.trim(), m=$('#orgMsg'); if (!/^\S+@\S+\.\S+$/.test(em)){ m.className='msg err'; m.textContent='Enter a valid email.'; return; }
      const c=S.config||{}; await DB.set('cb_meta','config',{...c, orgs:[...new Set([...(c.orgs||[]), em])], names:{...(c.names||{}), [em]:nm||em.split('@')[0]}}); m.className='msg ok'; m.textContent=`${em} can now sign in as an organizer (they tap "Create organizer account" the first time).`; }
    else if (ds.orgdel){ e.preventDefault(); const c=S.config||{}; await DB.set('cb_meta','config',{...c, orgs:(c.orgs||[]).filter(x=>x!==ds.orgdel)}); }
    else if (b.id==='impGo'){ const m=$('#impMsg'), lines=$('#impText').value.split('\n').map(l=>l.trim()).filter(Boolean); let np=0, ni=0; const rows=[...((S.info?.rows)||SEED.info.rows)].map(r=>[...r]); const parties=[];
      for (const l of lines){ const f=l.split('|').map(x=>x.trim());
        if (f[0].toLowerCase()==='info' && f.length>=3){ const i=rows.findIndex(r=>r[0].toLowerCase()===f[1].toLowerCase()); if (i>=0) rows[i]=[f[1],f.slice(2).join(' | ')]; else rows.push([f[1],f.slice(2).join(' | ')]); ni++; }
        else if (f.length>=5){ const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean); parties.push({party:f[0], golfers:list(f[1]), others:list(f[2]), room:/sgl/i.test(f[3])?'SGL':'DBL', nights:+f[4]||3}); }
      }
      if (!parties.length && !ni){ m.className='msg err'; m.textContent='Nothing to import. Check the format: Party | golfers | non-golfers | DBL or SGL | nights'; return; }
      if (parties.length){ for (const p of S.people) if (!parties.some(q=>q.party===p.party)) await DB.del('cb_people', p.id);
        for (const q of parties){ const ex=S.people.find(p=>p.party===q.party); await DB.set('cb_people', ex?.id || q.party.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40), q); np++; } }
      if (ni) await DB.set('cb_meta','info',{rows});
      await writePaySum(); m.className='msg ok'; m.textContent=`Imported ${np} parties${ni?` and ${ni} detail line${ni>1?'s':''}`:''}.`; $('#impText').value=''; }
    else if (b.id==='signOut'){ if (DB.auth) await DB.auth.A.signOut(DB.auth.auth); location.hash=''; location.reload(); }
  }catch(err){ console.error(err); const m=fm()||$('#pMsg')||$('#phMsg'); if (m){ m.className='msg err'; m.textContent='That didn\'t save. Check your connection and try again.'; } }
});
const confirmDel = what => window.confirm(`Delete ${what}?`);

if (DEMO) Object.assign(window, {S, strokesOf, lineFor, skinsFor, birdiesFor, ctpFor});
(DEMO ? initDemo : initFirebase)().catch(e=>{ console.error(e); $('#app').innerHTML='<div class="gate"><div class="card"><h1>Capricorn Bash</h1><p>Couldn\'t load. Check your connection and reload.</p></div></div>'; });
</script>
